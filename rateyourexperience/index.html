<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="robots" content="noindex,follow">
  <title>Rate Your Experience | Live Karaoke</title>
  <meta name="description" content="Rate and review your Live Karaoke experience.">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
    body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
    .review-hero{
      position:sticky;
      top:0;
      z-index:10;
      display:grid;
      place-items:center;
      width:100%;
      height:clamp(150px,24vh,280px);
      flex:0 0 auto;
      overflow:hidden;
      background:#000;
      border-bottom:1px solid rgba(255,43,43,.32);
      box-shadow:0 8px 24px rgba(0,0,0,.5);
    }
    .review-hero img{
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center;
    }
    iframe{
      display:block;
      width:100%;
      flex:1 1 auto;
      min-height:0;
      border:0;
      background:#050505;
    }
    @media(max-width:699px){
      .review-hero{height:clamp(125px,20vh,210px)}
    }
    @media(max-height:720px){
      .review-hero{height:clamp(105px,18vh,145px)}
    }
  </style>
</head>
<body>
  <picture class="review-hero" aria-label="Live Karaoke">
    <source srcset="/img/banner.avif" type="image/avif">
    <source srcset="/img/banner.webp" type="image/webp">
    <img src="/img/banner.png" alt="Live Karaoke - You Sing, I Play" decoding="async" fetchpriority="high">
  </picture>
  <iframe
    src="/livekaraoke26/request.html?directReview=1&v=20261126-compact-sticky-1"
    title="Rate your Live Karaoke experience"
    allow="clipboard-write"
  ></iframe>
</body>
</html>
