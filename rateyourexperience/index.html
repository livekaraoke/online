<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Rate Your Experience | Live Karaoke</title>
  <meta name="description" content="Rate and review your Live Karaoke experience.">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
    body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
    .review-hero{
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      height:clamp(180px,42vw,400px);
      flex:0 0 auto;
      overflow:hidden;
      background:#000;
      border-bottom:1px solid rgba(255,43,43,.32);
      box-shadow:0 8px 24px rgba(0,0,0,.5);
    }
    .review-hero img{
      display:block;
      width:min(94vw,1100px);
      max-width:94vw;
      height:auto;
      max-height:100%;
      object-fit:contain;
      object-position:center;
    }
    iframe{
      display:block;
      width:100%;
      flex:1 1 auto;
      min-height:0;
      border:0;
      background:#050505;
    }
    @media(max-width:699px){
      .review-hero{height:clamp(155px,48vw,240px)}
      .review-hero img{width:96vw;max-width:96vw}
    }
    @media(max-height:720px){
      .review-hero{height:clamp(130px,34vh,210px)}
    }
  </style>
</head>
<body>
  <div class="review-hero">
    <img src="/rateyourexperience/review-banner.webp?v=20261126-new-banner-1" alt="Live Karaoke - You Sing, I Play" decoding="async" fetchpriority="high">
  </div>
  <iframe
    id="reviewFrame"
    title="Rate your Live Karaoke experience"
    allow="clipboard-write"
  ></iframe>
  <script>
    (function(){
      var frame=document.getElementById("reviewFrame");
      frame.src="/livekaraoke26/request.html?directReview=1&fresh="+Date.now();
    })();
  </script>
</body>
</html>
