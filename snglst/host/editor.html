<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song List Editor</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="editor">

  <main class="songbook editor-page">

    <section class="songlist-banner">
      <h1>★ Song List Editor ★</h1>
      <p>Edit the Venue Main Public Song List</p>
    </section>

    <section class="editor-panel">
      <h2>List Settings</h2>

      <label>Public List Name</label>
      <input id="listNameInput" placeholder="Venue Main Public Song List">

      <button onclick="saveListSettings()" class="editor-btn red">
        Save List Settings
      </button>
    </section>

    <section class="editor-panel">
      <h2>Add Section / Category</h2>

      <label>Section Title</label>
      <input id="sectionTitleInput" placeholder="e.g. 90s Rock Songs">

      <label class="inline-check">
        <input type="checkbox" id="sectionOpenInput" checked>
        Open by default
      </label>

      <button onclick="addSection()" class="editor-btn">
        Add Section
      </button>
    </section>

    <section class="editor-panel">
      <h2>Add Song</h2>

      <label>Song Title</label>
      <input id="songTitleInput" placeholder="Song title">

      <label>Artist</label>
      <input id="songArtistInput" placeholder="Artist">

      <label>Section</label>
      <select id="songSectionSelect"></select>

      <button onclick="addSong()" class="editor-btn red">
        Add Song
      </button>
    </section>

    <section class="editor-panel">
      <h2>Seed / Reset</h2>

      <button onclick="seedFromOldPublicSongList()" class="editor-btn danger">
        Seed Full Old Public Song List
      </button>
    </section>

    <section class="editor-panel">
      <h2>Current Sections & Songs</h2>
      <p class="editor-help">
        Drag sections using ☰ to reorder them. “Total songs” counts only visible songs in Venue Main Public Song List.
      </p>

      <div id="editorSongList"></div>
    </section>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="../js/songlist.js"></script>

</body>
</html>
