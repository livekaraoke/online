<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Song List Editor</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="editor-body">

<header class="editor-topbar">
  <button onclick="window.location.href='../../admin.html'" class="editor-btn">◀ Admin</button>
  <h1>Song List Editor</h1>
<button onclick="seedVenueMainList()" class="editor-btn red">
  Seed Main List
</button>
  <button onclick="seedFromOldPublicSongList()" class="editor-btn red">
    Seed From Old Public Song List
  </button>
  <button onclick="seedVenueMainList()" class="editor-btn red">Seed Main List</button>
</header>

<main class="editor-layout">

  <section class="editor-panel">
    <h2>Song Lists</h2>

    <select id="listSelect" onchange="loadSelectedList()"></select>

    <input id="newListName" placeholder="New list name">
    <button onclick="createSongList()" class="editor-btn green">+ Create List</button>
    <button onclick="deleteCurrentList()" class="editor-btn danger">Delete List</button>

    <hr>

    <label>List Display Name</label>
    <input id="listNameInput">

    <label>
      <input type="checkbox" id="defaultListCheck">
      Default Public List
    </label>

    <button onclick="saveListSettings()" class="editor-btn red">Save List Settings</button>
  </section>

  <section class="editor-panel">
    <h2>Sections</h2>

    <div id="sectionEditorList"></div>

    <hr>

    <input id="newSectionTitle" placeholder="Section title">

    <select id="newSectionType">
      <option value="featured">Featured Songs</option>
      <option value="alphabetical">Automatic Full Song List</option>
      <option value="custom">Custom Songs</option>
      <option value="cta">Call To Action</option>
      <option value="ad">Advert / Promo</option>
      <option value="text">Text Block</option>
      <option value="html">HTML Block</option>
    </select>

    <label>
      <input type="checkbox" id="newSectionCollapsed">
      Start Closed / Collapsed
    </label>

    <button onclick="createSection()" class="editor-btn green">+ Add Section</button>
  </section>

  <section class="editor-panel wide">
    <h2>Selected Section Content</h2>

    <div id="selectedSectionInfo" class="section-info-box">
      Select a section to edit its content.
    </div>

    <div id="songPickerArea" class="hidden">
      <input id="songPickerSearch" placeholder="Search Firebase lyrics..." oninput="renderSongPicker()">
      <div id="songPickerResults"></div>
    </div>

    <div id="customContentArea" class="hidden">
      <label>Section Text / HTML / CTA Content</label>
      <textarea id="sectionContentInput"></textarea>

      <label>Button Text</label>
      <input id="sectionButtonText" placeholder="Example: Join Community">

      <label>Button URL</label>
      <input id="sectionButtonUrl" placeholder="https://...">

      <button onclick="saveSectionContent()" class="editor-btn red">Save Content</button>
    </div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="../js/songlist.js"></script>

<script>
  window.seedFromOldPublicSongList = seedFromOldPublicSongList;

  window.addEventListener("DOMContentLoaded", initEditor);
</script>

</body>
</html>
