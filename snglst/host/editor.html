<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Public Song List Editor</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="songlist-header editor-header">
    <h1>Public Song List Editor</h1>
    <button onclick="seedFromOldPublicSongList()" class="admin-btn red">
      Seed From Old Song List
    </button>
  </header>

  <main class="editor-container">

    <section class="editor-card">
      <h2>List Settings</h2>

      <label>Public Song List Name</label>
      <input id="listNameInput" placeholder="Venue Main Public Song List">

      <button onclick="saveListSettings()" class="admin-btn">
        Save List Name
      </button>
    </section>

    <section class="editor-card">
      <h2>Add Section</h2>

      <input id="sectionTitleInput" placeholder="Section title e.g. 90s Rock Songs">

      <label class="checkbox-row">
        <input type="checkbox" id="sectionOpenInput" checked>
        Open by default
      </label>

      <button onclick="addSection()" class="admin-btn">
        Add Section
      </button>
    </section>

    <section class="editor-card">
      <h2>Add Song</h2>

      <select id="songSectionSelect"></select>

      <input id="songTitleInput" placeholder="Song title">
      <input id="songArtistInput" placeholder="Artist">

      <button onclick="addSong()" class="admin-btn">
        Add Song
      </button>
    </section>

    <section class="editor-card">
      <h2>Sections & Songs</h2>
      <div id="editorSongList"></div>
    </section>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>

      apiKey: "AIzaSyC4gSodXM35E2ZdYaz6mrCvTUYzW75ZCBk",
      authDomain: "livekaraokemt.firebaseapp.com",

      messagingSenderId: "425980659562",

    const db = firebase.firestore();
  </script>

  <script src="../js/songlist.js"></script>
  <script>
    initEditor();
  </script>
</body>
</html>
