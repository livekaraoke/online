name: LiveSuite Admin gigs regression
on:
  push:
    branches: [main]
    paths:
      - 'ls26try/admin-new/**'
      - 'ls26try/tests/gig-operations.test.cjs'
      - 'ls26try/tests/admin-session-preview.test.cjs'
      - 'ls26try/tests/session-archive-timing.test.cjs'
      - 'ls26try/tests/session-smart-lifecycle.test.cjs'
      - 'ls26try/shared/performance-lifecycle.js'
      - '.github/workflows/admin-gigs-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-gigs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Admin gigs, session timing and archive regressions
        run: node --test ls26try/tests/gig-operations.test.cjs ls26try/tests/admin-session-preview.test.cjs ls26try/tests/session-archive-timing.test.cjs ls26try/tests/session-smart-lifecycle.test.cjs ls26try/tests/performance-intelligence.test.cjs
