name: LyricView and Run Order implementation checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lyricview-focused.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lyricview-focused-update-main
  cancel-in-progress: false
jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped patches to current source
        run: |
          python3 ls26try/verification/patch-finish-slot.py
      - name: Check JavaScript syntax and workflow invariants
        run: |
          node --check ls26try/admin-new/js/top-statusbar-session-tools.js
          node --check ls26try/shared/performance-tools-ui.js
          node --check ls26try/host/js/lyricview.js
          node ls26try/verification/queue-workflows.cjs
      - name: Commit targeted LiveSuite changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ls26try/admin-new/js/top-statusbar-session-tools.js ls26try/shared/performance-tools-ui.js ls26try/host/js/lyricview.js ls26try/host/lyricview.html ls26try/host/css/lyricview-completion.css
          git commit -m "Place Finish Next only beneath Song Complete"
          git push origin HEAD:main
