name: LyricView focused checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lyricview-focused.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check ls26try/host/js/lyricview.js
