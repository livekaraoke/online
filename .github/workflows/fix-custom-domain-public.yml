name: Fix custom-domain public site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-custom-domain-public.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix custom-domain guards and cache busting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guard_old = '  if (!/\\/online\\/(?:index\\.html)?$/i.test(location.pathname)) return;'
          guard_new = '''  const isPublicLiveKaraokeSite =\n    /\\/online\\/(?:index\\.html)?$/i.test(location.pathname) ||\n    (/^(?:www\\.)?livekaraoke\\.eu$/i.test(location.hostname) && /^\\/(?:index\\.html)?$/i.test(location.pathname));\n  if (!isPublicLiveKaraokeSite) return;'''

          for rel in [
              'js/live-karaoke-public-refresh.js',
              'js/live-karaoke-request-popup.js',
          ]:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              if guard_old not in s:
                  raise SystemExit(f'Expected guard not found in {rel}')
              p.write_text(s.replace(guard_old, guard_new, 1), encoding='utf-8')

          p = Path('livesuite/firebase-projects.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('live-karaoke-public-refresh.js?v=20261006-review-name-v1',
                        'live-karaoke-public-refresh.js?v=20261014-custom-domain-v1')
          s = s.replace('live-karaoke-request-popup.js?v=20261006-red-theme-v7',
                        'live-karaoke-request-popup.js?v=20261014-custom-domain-v1')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="livesuite/firebase-projects.js"></script>'
          new = '<script src="livesuite/firebase-projects.js?v=20261014-custom-domain-v2"></script>'
          if old not in s:
              raise SystemExit('Expected firebase-projects script tag not found in index.html')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-custom-domain-public.yml
          git add index.html livesuite/firebase-projects.js js/live-karaoke-public-refresh.js js/live-karaoke-request-popup.js
          git commit -m "Fix public site on livekaraoke.eu"
          git push
