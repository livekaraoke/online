name: LyricView Prompter remote
on:
  push:
    branches: [main]
    paths:
      - 'ls26try/host/js/lyricview-prompter-remote.js'
      - 'ls26try/oldadmin/host/lyrics/prompter-remote-receiver.js'
      - 'ls26try/host/css/lyricview-prompter-remote.css'
      - 'ls26try/shared/performance.js'
      - 'ls26try/host/lyricview.html'
      - 'ls26try/oldadmin/host/lyrics/song.html'
      - 'ls26try/verification/prompter-remote.cjs'
      - '.github/workflows/lyricview-prompter-remote.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test dependencies
        run: npm install --prefix "$RUNNER_TEMP/prompter-remote" --no-audit --no-fund playwright@1.62.1
      - name: Run browser tests and syntax checks
        run: |
          export LS26_TEST_NODE_MODULES="$RUNNER_TEMP/prompter-remote/node_modules"
          node --check ls26try/host/js/lyricview-prompter-remote.js
          node --check ls26try/oldadmin/host/lyrics/prompter-remote-receiver.js
          node --check ls26try/shared/performance.js
          node ls26try/verification/prompter-remote.cjs
