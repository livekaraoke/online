name: Force refresh public site assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-refresh-public-assets.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bust custom-domain public asset caches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('livesuite/firebase-projects.js?v=20261014-custom-domain-v2',
                        'livesuite/firebase-projects.js?v=20261014-custom-domain-v3')
          index.write_text(s, encoding='utf-8')

          loader = Path('livesuite/firebase-projects.js')
          s = loader.read_text(encoding='utf-8')
          replacements = {
            '../css/live-karaoke-public-refresh.css?v=20261006-spacing-fix-v1':
              '../css/live-karaoke-public-refresh.css?v=20261014-custom-domain-v3',
            '../css/live-karaoke-enquiry-green.css?v=20261006-enquiry-green-v1':
              '../css/live-karaoke-enquiry-green.css?v=20261014-custom-domain-v3',
            '../js/live-karaoke-public-refresh.js?v=20261014-custom-domain-v1':
              '../js/live-karaoke-public-refresh.js?v=20261014-custom-domain-v3',
            '../js/live-karaoke-request-popup.js?v=20261014-custom-domain-v1':
              '../js/live-karaoke-request-popup.js?v=20261014-custom-domain-v3',
            '../js/live-karaoke-public-request-lifecycle.js?v=20261013-request-lifecycle-v1':
              '../js/live-karaoke-public-request-lifecycle.js?v=20261014-custom-domain-v3',
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          loader.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/force-refresh-public-assets.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html livesuite/firebase-projects.js .github/workflows/force-refresh-public-assets.yml
          git commit -m 'Force-refresh public site assets on livekaraoke.eu'
          git push
