<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Note Editor · Our Hive</title><link rel="stylesheet" href="css/styles.css"></head><body><div class="app"><aside class="sidebar"><div class="sidebar-logo"><img src="assets/ourhive-logo.jpg"><h1 id="hiveName">Our Hive</h1><p>Built for two. Ready for more.</p></div><nav id="sideNav" class="nav"></nav><div class="profile-card"><div class="profile-row"><img id="currentUserPhoto" class="avatar"><div><b id="currentUserName"></b><div id="currentUserEmail" class="small"></div></div></div><button class="btn" style="width:100%;margin-top:10px" onclick="logout()">Logout</button></div></aside><main class="main"><section class="page-card"><div class="top-actions"><div class="title"><h2 id="pageTitle">New Note</h2><p>Write, format and share with your hive.</p></div><div><button class="btn" onclick="history.back()">Back</button><button class="btn primary" onclick="saveNote()">💾 Save</button></div></div><div class="toolbar"><input id="noteTitle" placeholder="Note title"><select id="scope"><option value="shared">Shared with Hive</option><option value="private">Private</option><option value="public">Public link</option></select></div><div class="toolbar"><button class="btn" onclick="formatText('bold')"><b>B</b></button><button class="btn" onclick="formatText('italic')"><i>I</i></button><button class="btn" onclick="formatText('underline')"><u>U</u></button><button class="btn" onclick="formatText('justifyLeft')">L</button><button class="btn" onclick="formatText('justifyCenter')">C</button><button class="btn" onclick="formatText('justifyRight')">R</button><button class="btn" onclick="formatColor('#ffffff')">White</button><button class="btn" onclick="formatColor('#7CFF3A')">Green</button><button class="btn" onclick="formatColor('#FFFF00')">Yellow</button><button class="btn" onclick="formatColor('#8fd0ff')">Blue</button><button class="btn danger" onclick="deleteNote()">Delete</button></div><div id="editor" class="note-editor" contenteditable="true" data-placeholder="Write your note here..."></div></section></main></div><nav id="mobileNav" class="mobile-nav"></nav><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/common.js"></script><script src="js/note-editor.js"></script></body></html>
