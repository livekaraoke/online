<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · Our Hive</title><link rel="stylesheet" href="css/styles.css"></head><body><div class="app"><aside class="sidebar"><div class="sidebar-logo"><img src="assets/ourhive-logo.jpg"><h1 id="hiveName">Our Hive</h1><p>Built for two. Ready for more.</p></div><nav id="sideNav" class="nav"></nav><div class="profile-card"><div class="profile-row"><img id="currentUserPhoto" class="avatar"><div><b id="currentUserName"></b><div id="currentUserEmail" class="small"></div></div></div><button class="btn" style="width:100%;margin-top:10px" onclick="logout()">Logout</button></div></aside><main class="main"><section class="page-card"><div class="top-actions"><div class="title"><h2>⚙️ Settings</h2><p>Manage your hive, invitations and membership.</p></div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h3>🐝 Hive Details</h3><div class="toolbar"><input id="hiveTitle" placeholder="Hive name"><input id="hiveTagline" placeholder="Tagline"><button class="btn primary" onclick="saveHiveDetails()">Save</button></div></div><div class="card"><h3>👥 Invite Member</h3><div class="toolbar"><input id="inviteEmail" placeholder="partner@gmail.com"><button class="btn primary" onclick="inviteMember()">Invite</button></div><p class="muted">They sign up with this email, then choose Join Hive.</p></div></div><div class="card" style="margin-top:18px"><h3>Available Hives</h3><div id="hives" class="items"></div></div><div class="card" style="margin-top:18px"><h3>Current Members</h3><div id="members" class="member-list"></div></div></section></main></div><nav id="mobileNav" class="mobile-nav"></nav><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/common.js"></script><script src="js/settings.js"></script></body></html>
