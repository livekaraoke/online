<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping List · Our Hive</title><link rel="stylesheet" href="css/styles.css"></head><body><div class="app"><aside class="sidebar"><div class="sidebar-logo"><img src="assets/ourhive-logo.jpg"><h1 id="hiveName">Our Hive</h1><p>Built for two. Ready for more.</p></div><nav id="sideNav" class="nav"></nav><div class="profile-card"><div class="profile-row"><img id="currentUserPhoto" class="avatar"><div><b id="currentUserName"></b><div id="currentUserEmail" class="small"></div></div></div><button class="btn" style="width:100%;margin-top:10px" onclick="logout()">Logout</button></div></aside><main class="main"><section class="page-card"><div class="top-actions"><div class="title"><h2>🛒 Shopping List</h2><p>Shared list for your hive, plus personal list.</p></div><button class="btn primary" onclick="addShoppingPrompt()">+ Add Item</button></div><div class="tabs"><button class="tab active" onclick="setMode('shared',this)">Shared List</button><button class="tab" onclick="setMode('mine',this)">My List</button></div><div class="toolbar"><input id="search" placeholder="Search items..."><select id="category"><option value="">All Categories</option><option>Dairy</option><option>Meat</option><option>Vegetables</option><option>Fruit</option><option>Bakery</option><option>Pantry</option><option>Other</option></select><select id="status"><option value="all">All</option><option value="todo">To Buy</option><option value="done">Bought</option></select></div><div id="items" class="items"></div></section></main></div><nav id="mobileNav" class="mobile-nav"></nav><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/common.js"></script><script src="js/shopping.js"></script></body></html>
