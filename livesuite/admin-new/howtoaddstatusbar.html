To add it to any page, put this near the top of the body, above the page content:

<div id="topStatusContainer"></div>

Add these CSS links:



<link rel="stylesheet" href="css/top-statusbar.css">

Add these scripts, after Firebase and firebase.js:

<script src="js/top-statusbar.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    LK.topStatus.loadTopStatusBar();
  });
</script>

Example order:

<script src="../firebase-projects.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script src="js/firebase.js"></script>
<script src="js/top-statusbar.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    LK.topStatus.loadTopStatusBar();
  });
</script>
