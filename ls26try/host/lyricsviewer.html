<html lang="en"><head><link rel="stylesheet" href="../shared/dialogs.css?v=20260910-stage4"><script src="../shared/dialogs.js?v=20260910-stage4"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song Library · LiveSuite</title>
<link rel="stylesheet" href="../admin-new/css/top-statusbar.css?v=20260910-stage4"><link rel="stylesheet" href="../admin-new/css/top-statusbar-session-tools.css?v=20260910-stage4"><link rel="stylesheet" href="../shared/theme.css?v=20260910-stage4"><link rel="stylesheet" href="../shared/performance.css?v=20260910-stage4"><link rel="stylesheet" href="../shared/library.css?v=20260910-stage4"><script src="../shared/data.js?v=20260910-stage4"></script></head>
<body class="library-page"><div id="topStatusContainer"></div>
<main id="libraryShell" class="library-shell">
<header class="library-heading"><h1>SONG LIBRARY <small><span id="statTotal">0</span> songs</small><span id="ls26SessionSetlistName" hidden></span></h1><a class="library-button green" href="lyricscreator.html">＋ ADD SONG</a><a class="library-button" href="setlist-editor.html">☷ SETLISTS</a></header>
<div class="library-search"><input id="searchInput" aria-label="Search songs" placeholder="⌕  Search songs, artists or lyrics…"><button id="sidebarToggleBtn" aria-expanded="false">☰ Filters</button><button id="exportBtn">⇩ EXPORT</button></div>
<section id="libraryFilterPanel" hidden aria-label="Song filters"><div class="library-filters"><select id="artistFilter" aria-label="Artist"><option value="">All artists</option></select><select id="keyFilter" aria-label="Key"><option value="">All keys</option></select><select id="genreFilter" aria-label="Genre"><option value="">All genres</option></select><select id="decadeFilter" aria-label="Decade"><option value="">All decades</option></select><select id="sortSelect" aria-label="Sort"><option value="title">Title A–Z</option><option value="artist">Artist A–Z</option><option value="recent">Recently updated</option><option value="bpm">BPM low–high</option></select></div>
<div class="library-bpm"><span>BPM from</span><button data-bpm="bpmMin:-10" aria-label="Lower minimum BPM">−</button><input id="bpmMin" type="number" min="0" max="400" step="10" placeholder="Any" aria-label="Minimum BPM"><button data-bpm="bpmMin:10" aria-label="Raise minimum BPM">＋</button><span>to</span><button data-bpm="bpmMax:-10" aria-label="Lower maximum BPM">−</button><input id="bpmMax" type="number" min="0" max="400" step="10" placeholder="Any" aria-label="Maximum BPM"><button data-bpm="bpmMax:10" aria-label="Raise maximum BPM">＋</button><small>10 BPM steps</small></div>
<section id="librarySidebar" class="library-extra" aria-label="Additional filters"><select id="visibilityFilter" aria-label="Public visibility"><option value="">All visibility</option><option value="shown">Shown in public list</option><option value="hidden">Hidden from public list</option></select><select id="contentFilter" aria-label="Content"><option value="">Any content</option><option value="lyrics">Lyrics</option><option value="tabs">Tabs</option></select><label><input id="stickyFavToggle" type="checkbox"> Favourites first</label><button id="clearFiltersBtn">Clear filters</button><button id="refreshBtn">↻ Refresh Library</button><span><span id="resultCount">0</span> matches</span><span hidden id="statFavs"></span><span hidden id="statPublic"></span><span hidden id="statSetlists"></span></section>
</section>
<div class="library-scope"><button data-scope="all" class="active">All songs</button><button data-scope="favourites">☆ Favourites</button><button data-scope="session">Session setlist</button><select id="setlistFilter" aria-label="Choose setlist"><option value="">Choose setlist</option></select></div>
<div class="library-results"><section class="song-table-panel"><div class="song-table-head"><span></span><span>SONG / ARTIST</span><span>KEY</span><span>BPM</span><span>CAPO</span><span>ACTIONS</span></div><div id="songRows" tabindex="0" aria-label="Scrollable song list"><div class="loading-state">Loading songs…</div></div></section><nav id="alphabetNav" aria-label="Alphabet navigation"></nav></div>
<section class="library-selected"><div><small>SELECTED SONG</small><strong id="ls26SelectedTitle">Select a song</strong></div><button id="ls26OpenSelected" disabled class="green">▶ OPEN LYRICVIEW</button><button id="ls26QueueSelected" disabled>☷ ADD TO RUN ORDER</button></section>
<footer class="library-player-bar"><div class="run-order-player-info"><strong>NEXT IN RUN ORDER</strong><span id="selectedSongLabel">No song queued</span><small id="runOrderPlayerMeta">Waiting for Run Order</small></div><button id="playSelectedBtn" disabled aria-label="Play next song"><svg class="ls26-play-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 3 29 16 7 29Z"/></svg></button><button id="openRunOrderBtn">☷ RUN ORDER</button></footer>
</main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script><script src="js/firebase-config.js?v=20260910-stage4"></script>

  <script src="../admin-new/js/top-statusbar-session-tools.js?v=20260910-stage4"></script>

    document.addEventListener("DOMContentLoaded", function () {
      if (window.LK?.topStatus?.loadTopStatusBar) LK.topStatus.loadTopStatusBar();
    });
  </script>

<script src="../shared/shell.js?v=20260910-stage4"></script><script src="../shared/inbox.js?v=20260910-stage4"></script><script src="../shared/session-ui.js?v=20260910-stage4"></script><script src="../shared/performance.js?v=20260910-stage4"></script></body>
