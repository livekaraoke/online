<body class="admin-body enquiries-page ls26-inbox-page">
  <div class="admin-shell">
    <div id="sidebarContainer"></div>
    <main class="admin-main enquiries-main song-inbox-main">
      <header class="enquiries-topbar">
        <div><h1>Song Inbox</h1><p>Missing songs to prepare for future gigs.</p></div>
        <button class="ls26-button" id="inboxCapture">＋ Capture song</button>
      </header>
      <div class="ls26-toolbar song-inbox-toolbar">
        <input id="inboxSearch" placeholder="Search loaded entries" aria-label="Search Song Inbox">
        <select id="inboxStatus" aria-label="Filter status"><option value="">All statuses</option><option>New</option><option>To Learn</option><option>Added</option><option>Skip</option></select>
        <button class="ls26-button" id="inboxRefresh">Refresh</button>
      </div>
      <p class="ls26-muted">Most requested first · 50 entries per page</p>
      <div id="inboxRows" class="ls26-card">Loading…</div>
      <button id="inboxMore" class="ls26-button">Load more</button>
      <div class="ls26-card"><p id="inboxDrafts"></p><button id="inboxRetry" class="ls26-button">Retry saved captures</button></div>
    </main>
  </div>
