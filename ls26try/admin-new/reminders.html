<body class="admin-body tool-page">
  <div class="admin-shell"><div id="sidebarContainer"></div><main class="admin-main tool-main">
<header class="tool-heading"><div><h1>Reminders</h1><p>Keep track of the next thing to do.</p></div><button id="reminderAdd" type="button">＋ Add reminder</button></header>
<div class="tool-card tool-filters">
<label>View<select id="reminderFilter"><option value="pending">Pending</option><option value="completed">Completed</option><option value="archived">Archived</option><option value="all">All reminders</option></select></label>
<label>Search<input id="reminderSearch" type="search" placeholder="Search reminders…"></label>
<label>Priority<select id="reminderPriorityFilter"><option value="">All priorities</option><option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option></select></label>
<label>Category<select id="reminderCategoryFilter"><option value="">All categories</option></select></label>
<label>Sort<select id="reminderSort"><option value="due">Due date first</option><option value="priority">Priority first</option><option value="newest">Newest first</option></select></label>
<label class="tool-check"><input id="reminderOverdue" type="checkbox"> Overdue only</label><button id="reminderRefresh" type="button">Refresh</button></div>
<div class="tool-list-status"><span id="reminderCount"></span><a href="admin.html">Admin / sign in</a></div><p id="reminderPageStatus" role="status"></p><div id="reminderRows" aria-live="polite"></div><button id="reminderMore" hidden type="button">Load more reminders</button>
</main></div>
