<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../shared/artist-names.js?v=20260925-artist-names"></script>
  <link rel="stylesheet" href="../shared/dialogs.css?v=20260924-followup">
  <script src="../shared/dialogs.js?v=20260924-followup"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Calendar · LiveSuite</title>
  <link rel="stylesheet" href="css/admin.css?v=20260910-stage4">
  <link rel="stylesheet" href="css/sidebar.css?v=20260910-stage4">
  <link rel="stylesheet" href="css/sidebar-suite.css?v=20260929-planner-tools">
  <link rel="stylesheet" href="../shared/tools.css?v=20260925-tools">
  <link rel="stylesheet" href="../shared/theme.css?v=20260929-logo-centred">
  <link rel="stylesheet" href="../shared/performance.css?v=20260929-lyric-sizing">
  <link rel="stylesheet" href="css/admin-navigation.css?v=20260929-admin-polish">
  <link rel="stylesheet" href="css/planner-tools.css?v=20260929-planner-tools">
  <script src="../shared/data.js?v=20260910-stage4"></script>
</head>
<body class="admin-body tool-page planner-page">
  <div class="admin-shell">
    <div id="sidebarContainer"></div>
    <main class="admin-main tool-main calendar-main">
      <header class="tool-heading">
        <div><h1>Calendar</h1><p>Gigs &amp; events, dated reminders and scheduled notes in one place.</p></div>
        <div class="tool-actions">
          <button id="calendarToday" type="button">Today</button>
          <button id="calendarNewNote" type="button">＋ New note</button>
        </div>
      </header>

      <section class="planner-card">
        <div class="calendar-controls">
          <div class="calendar-month-nav">
            <button id="calendarPrev" type="button" aria-label="Previous month">‹</button>
            <strong id="calendarMonthLabel">Calendar</strong>
            <button id="calendarNext" type="button" aria-label="Next month">›</button>
          </div>
          <div class="calendar-filter-row" aria-label="Calendar filters">
            <label class="calendar-filter"><input id="showEvents" type="checkbox" checked><span class="calendar-legend-dot event"></span> Gigs &amp; Events</label>
            <label class="calendar-filter"><input id="showReminders" type="checkbox" checked><span class="calendar-legend-dot reminder"></span> Reminders</label>
            <label class="calendar-filter"><input id="showNotes" type="checkbox" checked><span class="calendar-legend-dot note"></span> Notes</label>
          </div>
        </div>
        <div class="calendar-weekdays" aria-hidden="true"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div>
        <div id="calendarGrid" class="calendar-grid" aria-label="Monthly calendar"></div>
        <p id="calendarStatus" class="planner-status" role="status"></p>
      </section>

      <section class="planner-card">
        <div class="calendar-agenda-head">
          <div><h2 id="calendarSelectedTitle">Today</h2><p id="calendarSelectedSummary">Scheduled items</p></div>
        </div>
        <div id="calendarAgenda" class="calendar-agenda" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="../firebase-projects.js?v=20260910-stage4"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="js/firebase.js?v=20260910-stage4"></script>
  <script src="js/sidebar.js?v=20260929-planner-tools"></script>
  <script src="js/profile.js?v=20260929-members-align"></script>
  <script src="js/auth.js?v=20260910-stage4"></script>
  <script src="../shared/shell.js?v=20260929-planner-tools"></script>
  <script src="../shared/inbox.js?v=20260925-artist-names"></script>
  <script src="../shared/session-ui.js?v=20260925-live-click"></script>
  <script src="../shared/performance.js?v=20260925-live-click"></script>
  <script src="js/calendar.js?v=20260929-planner-tools"></script>
</body>
</html>
