<script>

let autoScrollActive = false;
let autoScrollFrame = null;
let lastTime = null;
let scrollPosition = window.scrollY;

const BASE_BPM = 120;
const BASE_SPEED = 10; // px/sec at 120 BPM, 1.0x

window.userSpeed = Number.isFinite(window.userSpeed) ? window.userSpeed : 0.8;
window.currentBPM = window.currentBPM || 120;
let scrollMultiplier = 0.8;
let autoScrollManualGesture = false;
let autoScrollResumeAt = 0;

function deferAutoScroll(milliseconds = 650) {
  if (!autoScrollActive) return;
  autoScrollResumeAt = Math.max(autoScrollResumeAt, performance.now() + milliseconds);
}
function setAutoScrollManualGesture(active) {
  if (!autoScrollActive) return;
  autoScrollManualGesture = Boolean(active);
  if (!active) deferAutoScroll(850);
}
window.deferAutoScroll = deferAutoScroll;
window.setAutoScrollManualGesture = setAutoScrollManualGesture;

function updateAutoScrollButton() {
  const btn = document.getElementById("scrollToggleBtn");
  if (btn) btn.textContent = autoScrollActive ? "⏸" : "▶";
}

/* START / STOP */
function toggleAutoScroll() {
  if (autoScrollActive) {
    stopAutoScroll();
  } else {
    autoScrollActive = true;
    autoScrollManualGesture = false;
    autoScrollResumeAt = 0;
    updateAutoScrollButton();
    startAutoScroll();
  }
}

/* AUTO SCROLL LOOP */
function startAutoScroll() {

  if (autoScrollFrame !== null) {
    cancelAnimationFrame(autoScrollFrame);
    autoScrollFrame = null;
  }

  lastTime = null;

  function step(timestamp) {
    if (!autoScrollActive) {
      autoScrollFrame = null;
      return;
    }
    if (lastTime === null) lastTime = timestamp;
    const delta = Math.min(0.05, Math.max(0, (timestamp - lastTime) / 1000));
    lastTime = timestamp;

    // Always resume from the actual scroll position after manual input.
    if (!autoScrollManualGesture && timestamp >= autoScrollResumeAt && delta > 0) {
      window.scrollTo(0, window.scrollY + BASE_SPEED * scrollMultiplier * delta);
    }
    autoScrollFrame = requestAnimationFrame(step);
  }

  autoScrollFrame = requestAnimationFrame(step);
}

/* STOP */
function stopAutoScroll() {
  autoScrollActive = false;
  lastTime = null;
  autoScrollManualGesture = false;
  autoScrollResumeAt = 0;

  if (autoScrollFrame !== null) {
    cancelAnimationFrame(autoScrollFrame);
    autoScrollFrame = null;
  }

  updateAutoScrollButton();
}

/* SPEED CONTROL */
function changeScrollSpeed(change) {

  window.userSpeed = (window.userSpeed ?? 0.8) + change;

  window.userSpeed = Math.max(0.1, Math.min(5, window.userSpeed));

  recalcSpeed();
}

/* Manual gestures now yield temporarily instead of stopping Auto Scroll. */

/* KEYBOARD SHORTCUTS */
document.addEventListener("keydown", (e) => {

  if (e.code === "Space") {
    e.preventDefault();
    toggleAutoScroll();
  }

  if (e.code === "ArrowUp") {
    changeScrollSpeed(0.034);
  }

  if (e.code === "ArrowDown") {
    changeScrollSpeed(-0.034);
  }
});

function resetScrollSpeed() {
  window.userSpeed = 0.8;
  recalcSpeed();
}

/* FULL SCREEN ENTER */
function tryEnterFullscreenOnce() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}

function toggleSongFullscreen(btn) {
  // In the persistent viewer, fullscreen the PARENT document, not this iframe.
  // Replacing/reloading the iframe then cannot exit the parent's fullscreen.
  const embedded = window.parent !== window && window.parent.__ls26PrompterShell === true;
  const fullscreenDoc = embedded ? window.parent.document : document;
  const target = fullscreenDoc.documentElement;
  const entering = !fullscreenDoc.fullscreenElement;
  try {
    const operation = entering ? target.requestFullscreen() : fullscreenDoc.exitFullscreen();
    Promise.resolve(operation).then(() => {
      try { localStorage.setItem(FS_KEY, entering ? "1" : "0"); } catch (_) {}
      btn.textContent = entering ? "✖ Exit FS" : "⛶ Fullscreen";
    }).catch(error => console.warn("Fullscreen request failed:", error));
  } catch (error) {
    console.warn("Fullscreen unavailable:", error);
  }
}

function toggleAutoscrollVisibility() {
  const controls = document.getElementById("autoScrollControls");
  const btn = document.getElementById("toggleAutoscrollBtn");
  if (!controls || !btn) return;
  const hide = !controls.classList.contains("hidden");
  controls.classList.toggle("hidden", hide);
  btn.textContent = hide ? "AUTO-SCROLL: OFF" : "AUTO-SCROLL: ON";
  btn.classList.toggle("active", !hide);
  try { localStorage.setItem("karaoke_hide_autoscroll", hide ? "1" : "0"); } catch (_) {}
}

</script>

<!-- ======================== JS CODE ======================== -->
<!-- ********************************************************* -->
<script>

// DEBUGGING ERROR FUNCTIONS ----------------------------

const debugLines = [];
let debugTimer = null;
let devFadeTimer = null;
let devSticky = false;

// Auto Debug Messages hide after 3secs
function setDevOpacity(value) {
  const panel = document.getElementById("devPanel");
  if (!panel) return;
  panel.style.opacity = value;
}

function applyDevOpacity() {
  const panel = document.getElementById("devPanel");
  if (!panel) return;

  if (devSticky) {
    panel.style.opacity = "0.40"; // sticky dim
  } else {
    panel.style.opacity = "0.30"; // normal dim
  }
}

function scheduleDevFade() {
  clearTimeout(devFadeTimer);

  const panel = document.getElementById("devPanel");
  if (!panel) return;

  // 👉 STEP 1: instantly brighten on any activity
  panel.style.opacity = "0.92";

  devFadeTimer = setTimeout(() => {
    // 👉 STEP 2: dim after 3s
    if (devSticky) {
      panel.style.opacity = "0.40";
    } else {
      panel.style.opacity = "0.30";
    }
  }, 3000);
}

const LOG = {
  INFO: 30,
  WARN: 20,
  ERROR: 10
};

function setDebug(message, level = "INFO") {
  const panel = document.getElementById("devPanel");
  const logBox = document.getElementById("debugLog");

  if (!panel || !logBox) return;

  panel.style.display = "block";

  const code = LOG[level] || 0;
  const timestamp = new Date().toLocaleTimeString();

  debugLines.push(
    `[${timestamp}] ${level}_CODE:${code} › ${message}`
  );

  if (debugLines.length > 8) {
    debugLines.shift();
  }

  logBox.innerHTML = debugLines.join("<br>");

  // ONLY ONCE
  scheduleDevFade();
}

function showError(msg) {
  document.getElementById("songTitle").textContent = "&#9888; " + msg;
  setDebug(msg, "ERROR");
}

function renderFallback() {
  const container = document.getElementById("lyrics-container");

  container.innerHTML = `
    <div style="padding:20px; color:#ff6666; font-size:18px;" >
      Lyrics could not be loaded.<br><br>
      Check that the file exists in:<br>
      <code>lyrics-data/${window.currentSongId}.js</code>
    </div>
  `;
}

function updateDebugHeader(songTitle, artist, bpm, speed) {
  const header = document.getElementById("debugHeader");
  if (!header) return;

  header.innerHTML = `
    <div><b>🎵 ${songTitle}</b> — ${artist}</div>
    <div>BPM: ${bpm} | Speed: ${speed.toFixed(2)}x</div>
  `;
}


// ------------------------------------------------------

// DEV PANEL --------------------------------------------

function toggleDevPanel() {
  // Keep the existing DEV CONSOLE close button in sync with the saved setting.
  window.prompterToggleDevConsole?.();
}

function refreshDevOpacity() {
  const panel = document.getElementById("devPanel");
  if (!panel) return;

  //clearTimeout(debugTimer);
  scheduleDevFade();


}

function toggleDevSticky() {
  const panel = document.getElementById("devPanel");
  const btn = document.getElementById("stickyBtn");

  devSticky = !devSticky;

  panel.classList.toggle("sticky", devSticky);

  btn.classList.toggle("active", devSticky);
  btn.textContent = devSticky ? "📍" : "📌";

  // 🔥 force visible immediately
  panel.style.opacity = "0.42";

  scheduleDevFade();
}

// ------------------------------------------------------


// SPEED CALCULATION & DISPLAY --------------------------

function updateSpeedDisplay() {
  const effective =
    (window.currentBPM / BASE_BPM) * window.userSpeed;

  const speedEl = document.getElementById("scrollSpeedDisplay");
  if (speedEl) {
    speedEl.textContent = effective.toFixed(2) + "x";
  }

  setDebug(`BPM: ${window.currentBPM} | Speed: ${effective.toFixed(2)}x`, "INFO");
}

function recalcSpeed() {
  const bpm = window.currentBPM || 120;

  scrollMultiplier = (bpm / BASE_BPM) * window.userSpeed;

  updateSpeedDisplay();
}

// ------------------------------------------------------

// LOAD SONG & LYRICS -----------------------------------
// Only the newest selection may update the view; older script callbacks are stale.
let lyricsLoadVersion = 0;
let activeLyricsScript = null;
let lastRenderedLyricsId = "";

function loadSong() {
  setDebug("loadSong started", "INFO");

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) {
    showError("No song ID provided in URL");
    return;
  }

  window.currentSongId = id;
  setDebug("Loading ID: " + id, "INFO");

  // ---------------- BPM ----------------

  let bpm = 120;

  if (Array.isArray(window.songs)) {

    const normalize = str =>
      String(str)
        .toLowerCase()
        .replace(/[\s\-_]/g, "")
        .trim();

    const song = window.songs.find(s =>
      normalize(s.id) === normalize(id)
    );

    if (song) {

      bpm = Number(song.bpm || 120);

      setDebug(
        `Detected BPM: ${bpm} for ${song.title}`,
        "INFO"
      );

    } else {

      setDebug(
        `Song BPM not found for ID: ${id}`,
        "WARN"
      );
    }

  } else {

    setDebug(
      "window.songs is missing or invalid",
      "ERROR"
    );
    window.songs = [];
  }

  window.currentBPM = bpm;
  window.userSpeed = 0.8;

  recalcSpeed();

  // ---------------- LYRICS ----------------
  const version = ++lyricsLoadVersion;
  if (activeLyricsScript) {
    activeLyricsScript.onload = null;
    activeLyricsScript.onerror = null;
    activeLyricsScript.remove();
  }
  const script = document.createElement("script");
  activeLyricsScript = script;
  const path = `lyrics-data/${encodeURIComponent(id)}.js`;

  setDebug("Loading lyrics: " + path, "INFO");

  script.src = path;

  setDebug("Reached lyrics loader", "INFO");

  script.onload = () => {
    if (version !== lyricsLoadVersion) return;
    activeLyricsScript = null;
    script.remove();
    setDebug("Lyrics script loaded: " + path, "INFO");
    const data = window.songData;

    if (!data) {
      showError("songData is undefined after script load");
      return;
    }

    const titleEl = document.getElementById("songTitle");
    if (titleEl) {
      titleEl.innerHTML = `
  <div class="song-main-title">${data.title}</div>
  <div class="song-artist">${data.artist}</div>
`;
    }

    renderLyrics(data.lyrics);
    // Do not reset position for repeated updates to the same song.
    if (lastRenderedLyricsId && lastRenderedLyricsId !== id) {
      stopAutoScroll();
      window.scrollTo(0, 0);
    }
    lastRenderedLyricsId = id;
    setDebug("Lyrics loaded successfully", "INFO");
  };

  script.onerror = () => {
    if (version !== lyricsLoadVersion) return;
    activeLyricsScript = null;
    script.remove();
    showError("FAILED to load lyrics file");
    renderFallback();
  };

  document.body.appendChild(script);
}

// ------------------------------------------------------


// RENDER LYRICS ----------------------------------------

function renderLyrics(blocks) {
  const container = document.getElementById("lyrics-container");
  container.innerHTML = "";

  blocks.forEach(block => {

    if (
      block.type === "section-seperator" ||
      block.type === "blank-seperator"
    ) {
      const div = document.createElement("div");
      div.className = block.type;
      container.appendChild(div);
      return;
    }

    const div = document.createElement("div");
    div.className = block.type;

    if (block.text) {
      div.textContent = block.text;
    }

    if (block.lines) {
      div.innerHTML = block.lines
        .map(line =>
          line === ""
            ? '<div class="mini-gap"></div>'
            : line
        )
        .join("<br>");
    }

    container.appendChild(div);
  });
  window.applySavedPrompterStyles?.();
}

// ------------------------------------------------------

// LOAD THE SONG !!! ------------------------------------
window.addEventListener("DOMContentLoaded", () => {
  loadSong();

  const fsWanted = localStorage.getItem(FS_KEY) === "1";

  if (fsWanted) {
    // Cannot auto-enter fullscreen safely.
    // Instead we prepare UI + wait for first interaction.
    document.addEventListener("click", tryEnterFullscreenOnce, { once: true });
  }
});

// ------------------------------------------------------


  /** SLAVE LYRICS: one listener in song-compat.js.
      The old implementation navigated to song.html for every song change. **/
const slaveLyricsToggle = document.getElementById("slaveLyricsToggle");
if (new URLSearchParams(window.location.search).get("slave") === "1") {
  slaveLyricsToggle.checked = true;
}
slaveLyricsToggle.addEventListener("change", function() {
  if (this.checked) window.startSlaveLyrics?.();
  else window.stopSlaveLyrics?.();
});

</script>
<!-- Resolve modern song IDs to legacy file slugs before initial load and Slave updates. -->
<script src="song-compat.js?v=20261022-inplace-v2"></script>

<!-- ==================== END OF JS CODE ===================== -->


</div>
