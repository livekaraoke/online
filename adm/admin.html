      <section class="admin-panel session-panel">
        <h2>🎙️ PERFORMANCE SESSION</h2>
      
       <div id="sessionSetupFields">
          <input id="sessionTitleInput" placeholder="Session Title">
          <input id="venueInput" list="venueOptions" placeholder="Venue">
          <datalist id="venueOptions">
            <option value="Whyte Harte">
            <option value="Smokehouse">
          </datalist>
        </div>
        
        <div id="activeSessionLabels" style="display:none;">
          <div><strong>Session:</strong> <span id="sessionTitleLabel"></span></div>
          <div><strong>Venue:</strong> <span id="venueLabel"></span></div>
        </div>
        
        <textarea id="sessionNotesInput" placeholder="Session notes..."></textarea>
        
        <div id="sessionActionStatus" class="session-action-status"></div>
        
        <div class="session-button-row">
          <button id="startPerformanceBtn" onclick="confirmStartPerformance()">START PERFORMANCE</button>
          <button id="startBreakBtn" onclick="startBreak()">START BREAK</button>
          <button id="endBreakBtn" onclick="endBreak()">END BREAK</button>
          <button id="endPerformanceBtn" onclick="confirmEndPerformance()">END PERFORMANCE</button>
        </div>
        <div id="sessionDashboard" class="session-dashboard"></div>
      </section>
