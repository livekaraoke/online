<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Live Karaoke Admin</title>

  <link rel="stylesheet" href="../css/style.css">

</head>

<body class="admin-body">

  <div id="passwordGate" class="password-gate">
    <div class="gate-box">
      <h2>Admin Login</h2>
  
      <input type="email" id="emailInput" placeholder="Email..." autocomplete="email" />
  
      <input type="password" id="passwordInput" placeholder="Password..." autocomplete="current-password" />
  
      <button onclick="adminLogin()">Login</button>
  
      <p id="passwordError" class="error"></p>
    </div>
  </div>

  

  <!-- TOP BUTTON -->
  <!--
  <div class="admin-top">
    <button onclick="goMainSite()" class="admin-btn">
      ⬅ GO BACK TO MAIN SITE
    </button>
  </div>
  -->
  <div id="adminContent" style="display:none;">
    <!-- CONSOLE -->
    <div class="admin-container">

      <br>
  
      <h1>LIVE KARAOKE ADMIN</h1>
  
      <button onclick="setLive(true)" class="admin-btn live-btn">
        🟢 GO LIVE
      </button>
  
      <button onclick="setLive(false)" class="admin-btn">
        🔴 END LIVE
      </button>
  
      <button onclick="toggleSongs(true)" class="admin-btn">
        🟢 ENABLE SONGS
      </button>
  
      <button onclick="toggleSongs(false)" class="admin-btn">
        🔴 LOCK SONGS
      </button>
  
      <button onclick="goMainSite()" class="admin-btn">
        ⬅ GO BACK TO MAIN SITE
      </button>
  
      <button onclick="adminLogout()" class="admin-btn">
        LOG OUT
      </button>
        
      <h2>CONTROL PANEL</h2>
  
      <div id="adminConsole" class="admin-console"></div>
      
    </div>
  </div>

  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>


  <script>

    const consoleBox = document.getElementById("adminConsole");
    
    let logHistory = [];
    
    function logAdmin(message) {

        const time = new Date().toLocaleTimeString();
    
        logHistory.push(`[${time}] ${message}`);
    
        if (logHistory.length > 50) logHistory.shift();
    
        renderConsole();
    }
    
    function renderConsole() {

        consoleBox.innerHTML = "";
    
        const visibleLogs = logHistory.slice(-10); // last 10 logs
    
        visibleLogs.forEach(log => {
            const div = document.createElement("div");
            div.className = "console-line";
            div.innerText = log;
            consoleBox.appendChild(div);
        });
    
        consoleBox.scrollTop = consoleBox.scrollHeight; // auto scroll down
    }

    const firebaseConfig = {

      apiKey: "AIzaSyC4gSodXM35E2ZdYaz6mrCvTUYzW75ZCBk",

      authDomain: "livekaraokemt.firebaseapp.com",

      projectId: "livekaraokemt",

      storageBucket: "livekaraokemt.firebasestorage.app",

      messagingSenderId: "425980659562",

      appId: "1:425980659562:web:892ddcd53fb209d1114713"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();

    /*
    function setLive(state) {
    
        db.collection("karaoke").doc("state").update({
            isLive: state,
            manualOverride: true
        });
    
        logAdmin(state ? "GO LIVE activated" : "LIVE ended");
    }*/

    function setLive(state) {
    
        db.collection("karaoke").doc("state").update({
            isLive: state,
            manualOverride: state
        });
    
    }

    /*
    function toggleSongs(state) {
    
        db.collection("karaoke").doc("state").update({
            songsEnabled: state
        });
    
        logAdmin(state ? "Songs ENABLED" : "Songs LOCKED");
    }
    */


    function toggleSongs(state) {
    
        db.collection("karaoke").doc("state").update({
            songsOverride: true,
            songsEnabled: state
        });
    
    }

    function loadCurrentState() {
    
        db.collection("karaoke").doc("state").get().then(doc => {
    
            const data = doc.data();
    
            logAdmin("System loaded");
    
            logAdmin("Live: " + data.isLive);
    
            logAdmin("Songs: " + data.songsEnabled);
    
            logAdmin("Venue: " + data.venueAccessCode);
    
        });
    
    }
    
    loadCurrentState();

    function goMainSite() {
        window.location.href = "https://livekaraoke.github.io/online/";
    }

    const CORRECT_PASSWORD = "8765432"; // <-- change this
  
    function fixViewportHeight() {
      const gate = document.getElementById("passwordGate");
  
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
  
      if (gate) {
        gate.style.height = window.innerHeight + "px";
      }  
    }
  
    window.addEventListener("resize", fixViewportHeight);
    window.addEventListener("load", fixViewportHeight);
  
    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const error = document.getElementById("passwordError");
  
      if (input === CORRECT_PASSWORD) {
        document.getElementById("passwordGate").style.display = "none";
      } else {
        error.textContent = "Incorrect password";
      }
    }
  
    // Optional: press Enter to submit
    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        checkPassword();
      }
    });

      const auth = firebase.auth();
    
      function adminLogin() {
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const error = document.getElementById("passwordError");
    
        error.textContent = "Checking...";
    
        auth.signInWithEmailAndPassword(email, password)
          .then(() => {
            document.getElementById("passwordGate").style.display = "none";
            error.textContent = "";
            logAdmin("Admin logged in");
          })
          .catch((err) => {
            console.error(err);
            error.textContent = "Incorrect email or password";
          });
      }
    
      auth.onAuthStateChanged((user) => {

        const gate = document.getElementById("passwordGate");
        const adminContent = document.getElementById("adminContent");
    
        if (user) {
    
            gate.style.display = "none";
    
            adminContent.style.display = "block";
    
            if (typeof logAdmin === "function") {
                logAdmin("Logged in as: " + user.email);
            }
    
        } else {
    
            gate.style.display = "flex";
    
            adminContent.style.display = "none";
    
        }
    });
    
      document.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && document.getElementById("passwordGate").style.display !== "none") {
          adminLogin();
        }
      });


    function adminLogout() {
      auth.signOut().then(() => {
        logAdmin("Logged out");
      });
    }



  </script>

</body>

</html>
