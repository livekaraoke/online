    let logHistory = [];

    function logAdmin(message) {

        const time = new Date().toLocaleTimeString();
    
        logHistory.push(`[${time}] ${message}`);
    
        if (logHistory.length > 50) logHistory.shift();
    
        renderConsole();
    }
    
    function renderConsole() {

        consoleBox.innerHTML = "";
    
        const visibleLogs = logHistory.slice(-10); // last 10 logs
    
        visibleLogs.forEach(log => {
            const div = document.createElement("div");
            div.className = "console-line";
            div.innerText = log;
            consoleBox.appendChild(div);
        });
    
        consoleBox.scrollTop = consoleBox.scrollHeight; // auto scroll down
    }

    function toggleSongs(state) {
    
        db.collection("karaoke").doc("state").update({
            songsOverride: true,
            songsEnabled: state
        });
    
    }

    function loadCurrentState() {
    
        db.collection("karaoke").doc("state").get().then(doc => {
            const data = doc.data();
            logAdmin("System loaded");
            logAdmin("Live: " + data.isLive);
            logAdmin("Songs: " + data.songsEnabled);
            logAdmin("VAC: " + data.vac);
        });
    }
    
    loadCurrentState();

    function goMainSite() {
        window.location.href = "https://livekaraoke.github.io/online/";
    }

    const CORRECT_PASSWORD = "8765432"; // <-- change this
  
    function fixViewportHeight() {
      const gate = document.getElementById("passwordGate");
  
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
  
      if (gate) {
        gate.style.height = window.innerHeight + "px";
      }  
    }
  
    window.addEventListener("resize", fixViewportHeight);
    window.addEventListener("load", fixViewportHeight);
  
    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const error = document.getElementById("passwordError");
  
      if (input === CORRECT_PASSWORD) {
        document.getElementById("passwordGate").style.display = "none";
      } else {
        error.textContent = "Incorrect password";
      }
    }
  
    // Optional: press Enter to submit
    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        checkPassword();
      }
    });

      const auth = firebase.auth();
    
      function adminLogin() {
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const error = document.getElementById("passwordError");
    
        error.textContent = "Checking...";
    
        auth.signInWithEmailAndPassword(email, password)
          .then(() => {
            document.getElementById("passwordGate").style.display = "none";
            error.textContent = "";
            logAdmin("Admin logged in");
          })
          .catch((err) => {
            console.error(err);
            error.textContent = "Incorrect email or password";
          });
      }
    
      auth.onAuthStateChanged((user) => {

        const gate = document.getElementById("passwordGate");
        const adminContent = document.getElementById("adminContent");
    
        if (user) {
    
            gate.style.display = "none";
    
            adminContent.style.display = "block";
    
            if (typeof logAdmin === "function") {
                logAdmin("Logged in as: " + user.email);
            }
    
        } else {
    
            gate.style.display = "flex";
    
            adminContent.style.display = "none";
    
        }
    });
    
      document.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && document.getElementById("passwordGate").style.display !== "none") {
          adminLogin();
        }
      });


    function adminLogout() {
      auth.signOut().then(() => {
        logAdmin("Logged out");
      });
    }

    function getCurrentEvent(event) {

        if (!event || !event.start || !event.end) {
            return null;
        }
    
        let start = new Date(event.start);
        let end = new Date(event.end);
    
        if (isNaN(start.getTime()) || isNaN(end.getTime())) {
            return null;
        }
    
        const now = new Date();
    
        if (event.repeatWeekly) {
    
            while (end < now) {
    
                start.setDate(start.getDate() + 7);
                end.setDate(end.getDate() + 7);
    
            }
        }
    
        return { start, end };
    }

    db.collection("karaoke").doc("state").onSnapshot((doc) => {
        currentState = doc.data();
        updateAdminButtons(currentState);
    });

    function updateAdminButtons(data) {
        const now = new Date();
        const eventTimes = getCurrentEvent(data.nextEvent);
    
        if (!eventTimes) return;
    
        const start = eventTimes.start;
        const end = eventTimes.end;
    
        let isLive;
    
        if (data.manualOverride) {
            isLive = data.isLive;
        } else {
            isLive = now >= start && now <= end;
        }
    
        let songsAvailable;
    
        if (data.songsOverride) {
            songsAvailable = data.songsEnabled;
        } else {
            songsAvailable = isLive;
        }
    
        document.getElementById("liveToggleBtn").innerText = isLive ? "🔴 END LIVE" : "🟢 GO LIVE";
    
        const songsBtn = document.getElementById("songsToggleBtn");
    
        if (!isLive) {
            songsBtn.innerText = "🔒 SONGS LOCKED";
        } else {
            songsBtn.innerText = songsAvailable ? "🔴 LOCK SONGS" : "🟢 UNLOCK SONGS";
        }
    }
    
    setInterval(() => {
        if (currentState) {
            updateAdminButtons(currentState);
        }
    }, 30000);
    
    function toggleLive() {
        if (!currentState) return;
    
        const now = new Date();
        const eventTimes = getCurrentEvent(currentState.nextEvent);
        const start = eventTimes.start;
        const end = eventTimes.end;
    
        let isLive = currentState.manualOverride
            ? currentState.isLive
            : now >= start && now <= end;
    
        db.collection("karaoke").doc("state").update({
            manualOverride: true,
            isLive: !isLive
        });
    
        logAdmin(!isLive ? "GO LIVE activated" : "LIVE ended manually");
    }

    function toggleSongsAuto() {
        if (!currentState) return;
    
        const now = new Date();
        const eventTimes = getCurrentEvent(currentState.nextEvent);
    
        if (!eventTimes) {
            logAdmin("Cannot change songs: event date error");
            return;
        }
    
        const start = eventTimes.start;
        const end = eventTimes.end;
    
        const isLive = currentState.manualOverride
            ? currentState.isLive
            : now >= start && now <= end;
    
        if (!isLive) {
            db.collection("karaoke").doc("state").update({
                songsOverride: true,
                songsEnabled: false
            });
    
            logAdmin("Cannot unlock songs: event is not live");
            return;
        }
    
        const songsAvailable = currentState.songsOverride
            ? currentState.songsEnabled
            : true;
    
        if (songsAvailable) {
            db.collection("karaoke").doc("state").update({
                songsOverride: true,
                songsEnabled: false
            });
    
            logAdmin("Songs LOCKED manually");
        } else {
            db.collection("karaoke").doc("state").update({
                songsOverride: false,
                songsEnabled: true
            });
    
            logAdmin("Songs UNLOCKED during live event");
        }
    }
