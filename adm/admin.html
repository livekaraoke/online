    function tsToDate(ts) {
      if (!ts) return null;
      return ts.toDate ? ts.toDate() : new Date(ts);
    }
    
    function formatTime(date) {
      if (!date) return "-";
      return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    
    function formatDuration(ms) {
      if (!ms || ms < 0) ms = 0;
      const totalMin = Math.floor(ms / 60000);
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return h ? `${h}h ${m}m` : `${m}m`;
    }
    
    async function getOrCreateTestSession() {
      const ref = db.collection("performanceSessions").doc("test-session");
    
      await ref.set({
        title: "Test Session",
        venue: "Test",
        status: "test",
        isActive: false,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    
      return ref.id;
    }
    
    async function startPerformanceSession() {
      const title = document.getElementById("sessionTitleInput").value.trim() || "Live Karaoke Session";
      const venue = document.getElementById("venueInput").value.trim() || "Unknown Venue";
      const notes = document.getElementById("sessionNotesInput").value.trim();
    
      const ref = await db.collection("performanceSessions").add({
        title,
        venue,
        notes,
        status: "active",
        isActive: true,
        startedAt: firebase.firestore.FieldValue.serverTimestamp(),
        endedAt: null,
        breaks: [],
        breakOpen: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    
      await db.collection("karaokeControl").doc("currentSession").set({
        activeSessionId: ref.id,
        title,
        venue,
        startedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    
      logAdmin("Performance session started");
    }
    
    async function startSessionBreak() {
      if (!activeSession?.id || activeSession.breakOpen) return;
    
      const ref = db.collection("performanceSessions").doc(activeSession.id);
      const snap = await ref.get();
      const data = snap.data();
    
      const breaks = data.breaks || [];
      breaks.push({
        start: new Date(),
        end: null
      });
    
      await ref.set({
        breaks,
        breakOpen: true,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    
      logAdmin("Break started");
    }
    
    async function endSessionBreak() {
      if (!activeSession?.id || !activeSession.breakOpen) return;
    
      const ref = db.collection("performanceSessions").doc(activeSession.id);
      const snap = await ref.get();
      const data = snap.data();
    
      const breaks = data.breaks || [];
      const last = breaks[breaks.length - 1];
    
      if (last && !last.end) {
        last.end = new Date();
      }
    
      await ref.set({
        breaks,
        breakOpen: false,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    
      logAdmin("Break ended");
    }
    
    async function endPerformanceSession() {
      if (!activeSession?.id) return;
      if (!confirm("End this performance session?")) return;
    
      await db.collection("performanceSessions").doc(activeSession.id).set({
        status: "ended",
        isActive: false,
        endedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    
      await db.collection("karaokeControl").doc("currentSession").set({
        activeSessionId: null,
        endedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    
      logAdmin("Performance session ended");
    }
    
    function listenActiveSession() {
      db.collection("performanceSessions")
        .where("isActive", "==", true)
        .onSnapshot(snapshot => {
          if (snapshot.empty) {
            activeSession = null;
            renderSessionDashboard();
            listenActiveRequests(null);
            return;
          }
    
          const doc = snapshot.docs[0];
          activeSession = { id: doc.id, ...doc.data() };
    
          document.getElementById("sessionTitleInput").value = activeSession.title || "";
          document.getElementById("venueInput").value = activeSession.venue || "";
          document.getElementById("sessionNotesInput").value = activeSession.notes || "";
    
          renderSessionDashboard();
          listenActiveRequests(activeSession.id);
        });
    }
    
    function listenActiveRequests(sessionId) {
      if (!sessionId) {
        activeRequests = [];
        renderActiveRequests();
        return;
      }
    
      db.collection("publicSongRequests")
        .where("sessionId", "==", sessionId)
        .onSnapshot(snapshot => {
          activeRequests = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
    
          renderSessionDashboard();
          renderActiveRequests();
        });
    }
    
    function getRequestCounts() {
      return {
        completed: activeRequests.filter(r => r.status === "completed").length,
        abandoned: activeRequests.filter(r => r.status === "abandoned").length,
        deleted: activeRequests.filter(r => r.status === "deletedByHost").length,
        left: activeRequests.filter(r => !r.status || r.status === "pending").length
      };
    }
    
    function getBreakMs(session) {
      let total = 0;
      const now = new Date();
    
      (session?.breaks || []).forEach(br => {
        const start = tsToDate(br.start);
        const end = br.end ? tsToDate(br.end) : now;
        if (start && end) total += end - start;
      });
    
      return total;
    }
    
    function renderSessionDashboard() {
      const box = document.getElementById("sessionDashboard");
      if (!box) return;
    
      if (!activeSession) {
        box.innerHTML = `<div class="dash-empty">No active session.</div>`;
        return;
      }
    
      const start = tsToDate(activeSession.startedAt);
      const end = tsToDate(activeSession.endedAt) || new Date();
      const breakMs = getBreakMs(activeSession);
      const totalMs = end - start;
      const activeMs = totalMs - breakMs;
      const counts = getRequestCounts();
    
      box.innerHTML = `
        <div><strong>Date:</strong> ${start ? start.toLocaleDateString() : "-"}</div>
        <div><strong>Venue:</strong> ${activeSession.venue || "-"}</div>
        <div><strong>Started:</strong> ${formatTime(start)}</div>
        <div><strong>Elapsed:</strong> ${formatDuration(totalMs)}</div>
        <div id="breaksLabel">Breaks: 0 ( 0mins )</div>
        <div><strong>Total with breaks:</strong> ${formatDuration(totalMs)}</div>
        <div><strong>Total without breaks:</strong> ${formatDuration(activeMs)}</div>
        <div><strong>Completed:</strong> ${counts.completed}</div>
        <div><strong>Abandoned:</strong> ${counts.abandoned}</div>
        <div><strong>Deleted by host:</strong> ${counts.deleted}</div>
        <div><strong>Requests left:</strong> ${counts.left}</div>
      `;
    }
    
    function renderActiveRequests() {
      const box = document.getElementById("activeRequestsList");
      if (!box) return;
    
      const pending = activeRequests
        .filter(r => !r.status || r.status === "pending")
        .sort((a, b) => {
          const da = tsToDate(a.createdAt)?.getTime() || 0;
          const dbb = tsToDate(b.createdAt)?.getTime() || 0;
          return da - dbb;
        });
    
      if (!pending.length) {
        box.innerHTML = `<div class="dash-empty">No active requests.</div>`;
        return;
      }
    
      box.innerHTML = pending.map(req => {
        const created = tsToDate(req.createdAt);
        const minsAgo = created ? Math.max(0, Math.floor((Date.now() - created.getTime()) / 60000)) : "-";
    
        return `
          <div class="active-request-row">
            <div class="request-main">
              <strong>${escapeHTML(req.songTitle || req.title || "")}</strong>
              <span>${escapeHTML(req.singerName || req.name || "")}</span>
            </div>
    
            <div class="request-bpm">${escapeHTML(req.userBpm || "")}</div>
            <div class="request-time">${minsAgo}m</div>
    
            <button title="Completed" onclick="completeRequest('${req.id}')">★</button>
            <button title="Abandoned" onclick="openRequestReasonModal('${req.id}', 'abandoned')">⚠</button>
            <button title="Delete" onclick="openRequestReasonModal('${req.id}', 'deletedByHost')">✕</button>
          </div>
        `;
      }).join("");
    }
    
    async function completeRequest(requestId) {
      await db.collection("publicSongRequests").doc(requestId).set({
        status: "completed",
        completedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    
      logAdmin("Song request completed");
    }
    
    function openRequestReasonModal(requestId, action) {
      pendingRequestAction = { requestId, action };
    
      document.getElementById("requestReasonTitle").innerText =
        action === "abandoned" ? "Mark Request Abandoned" : "Delete Request";
    
      document.getElementById("requestReasonInput").value = "";
      document.getElementById("requestReasonModal").classList.remove("hidden");
    }
    
    function closeRequestReasonModal() {
      pendingRequestAction = null;
      document.getElementById("requestReasonModal").classList.add("hidden");
    }
    
    async function confirmRequestReason() {
      if (!pendingRequestAction) return;
    
      const note = document.getElementById("requestReasonInput").value.trim();
      const { requestId, action } = pendingRequestAction;
    
      const update = {
        status: action,
        hostNote: note,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
    
      if (action === "abandoned") {
        update.abandonedAt = firebase.firestore.FieldValue.serverTimestamp();
      }
    
      if (action === "deletedByHost") {
        update.deletedByHostAt = firebase.firestore.FieldValue.serverTimestamp();
      }
    
      await db.collection("publicSongRequests").doc(requestId).set(update, { merge: true });
    
      closeRequestReasonModal();
      logAdmin(action === "abandoned" ? "Request abandoned" : "Request deleted by host");
    }
    
    function escapeHTML(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
    
    setInterval(() => {
      renderSessionDashboard();
      renderActiveRequests();
    }, 30000);

    function getCurrentEvent(event) {

        if (!event || !event.start || !event.end) {
            return null;
        }
    
        let start = new Date(event.start);
        let end = new Date(event.end);
    
        if (isNaN(start.getTime()) || isNaN(end.getTime())) {
            return null;
        }
    
        const now = new Date();
    
        if (event.repeatWeekly) {
    
            while (end < now) {
    
                start.setDate(start.getDate() + 7);
                end.setDate(end.getDate() + 7);
    
            }
        }

    db.collection("karaoke").doc("state").onSnapshot((doc) => {
        currentState = doc.data();
        updateAdminButtons(currentState);
    });

    function updateAdminButtons(data) {
        const now = new Date();
        const eventTimes = getCurrentEvent(data.nextEvent);
    
        if (!eventTimes) return;
    
        const start = eventTimes.start;
        const end = eventTimes.end;
    
        let isLive;
    
        if (data.manualOverride) {
            isLive = data.isLive;
        } else {
            isLive = now >= start && now <= end;
        }
    
        let songsAvailable;
    
        if (data.songsOverride) {
            songsAvailable = data.songsEnabled;
        } else {
            songsAvailable = isLive;
        }
    
        document.getElementById("liveToggleBtn").innerText = isLive ? "🔴 END LIVE" : "🟢 GO LIVE";
    
        const songsBtn = document.getElementById("songsToggleBtn");
    
        if (!isLive) {
            songsBtn.innerText = "🔒 SONGS LOCKED";
        } else {
            songsBtn.innerText = songsAvailable ? "🔴 LOCK SONGS" : "🟢 UNLOCK SONGS";
        }
    }
    
    setInterval(() => {
        if (currentState) {
            updateAdminButtons(currentState);
        }
    }, 30000);
    
    function toggleLive() {
        if (!currentState) return;
    
        const now = new Date();
        const eventTimes = getCurrentEvent(currentState.nextEvent);
        const start = eventTimes.start;
        const end = eventTimes.end;
    
        let isLive = currentState.manualOverride
            ? currentState.isLive
            : now >= start && now <= end;
    
        db.collection("karaoke").doc("state").update({
            manualOverride: true,
            isLive: !isLive
        });
    
        logAdmin(!isLive ? "GO LIVE activated" : "LIVE ended manually");
    }

    function toggleSongsAuto() {
        if (!currentState) return;
    
        const now = new Date();
        const eventTimes = getCurrentEvent(currentState.nextEvent);
    
        if (!eventTimes) {
            logAdmin("Cannot change songs: event date error");
            return;
        }
    
        const start = eventTimes.start;
        const end = eventTimes.end;
    
        const isLive = currentState.manualOverride
            ? currentState.isLive
            : now >= start && now <= end;
    
        if (!isLive) {
            db.collection("karaoke").doc("state").update({
                songsOverride: true,
                songsEnabled: false
            });
    
            logAdmin("Cannot unlock songs: event is not live");
            return;
        }
    
        const songsAvailable = currentState.songsOverride
            ? currentState.songsEnabled
            : true;
    
        if (songsAvailable) {
            db.collection("karaoke").doc("state").update({
                songsOverride: true,
                songsEnabled: false
            });
    
            logAdmin("Songs LOCKED manually");
        } else {
            db.collection("karaoke").doc("state").update({
                songsOverride: false,
                songsEnabled: true
            });
    
            logAdmin("Songs UNLOCKED during live event");
        }
    }

    let currentSessionId = null;
let currentSessionData = null;
let sessionNotesSaveTimer = null;

function setSessionStatus(message) {
  document.getElementById("sessionActionStatus").innerText = message || "";
  logAdmin(message);
}

function showSessionConfirm(title, message, onConfirm) {
  const ok = confirm(`${title}\n\n${message}`);
  if (ok) onConfirm();
}

function confirmStartPerformance() {
  showSessionConfirm(
    "Start Performance?",
    "This will start a new live session and begin linking new song requests to it.",
    startPerformance
  );
}

function confirmEndPerformance() {
  showSessionConfirm(
    "End Performance?",
    "This will end the active session. New song requests will no longer be linked to this session.",
    endPerformance
  );
}

async function startPerformance() {
  const title = document.getElementById("sessionTitleInput").value.trim() || "Untitled Session";
  const venue = document.getElementById("venueInput").value.trim() || "Unknown Venue";

  const ref = await db.collection("performanceSessions").add({
    title,
    venue,
    notes: document.getElementById("sessionNotesInput").value || "",
    status: "active",
    startedAt: firebase.firestore.FieldValue.serverTimestamp(),
    endedAt: null,
    breaks: [],
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  currentSessionId = ref.id;

  await db.collection("karaokeControl").doc("currentSession").set({
    sessionId: currentSessionId,
    title,
    venue,
    active: true,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  setSessionStatus("Performance started.");
  listenToCurrentSession();
}

async function endPerformance() {
  if (!currentSessionId) return;

  await db.collection("performanceSessions").doc(currentSessionId).set({
    status: "ended",
    endedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });

  await db.collection("karaokeControl").doc("currentSession").set({
    active: false,
    sessionId: null,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });

  setSessionStatus("Performance ended.");
}

async function startBreak() {
  if (!currentSessionId || !currentSessionData) return;

  const breaks = currentSessionData.breaks || [];
  const lastBreak = breaks[breaks.length - 1];

  if (lastBreak && !lastBreak.endedAt) return;

  breaks.push({
    startedAt: firebase.firestore.Timestamp.now(),
    endedAt: null
  });

  await db.collection("performanceSessions").doc(currentSessionId).set({
    breaks
  }, { merge: true });

  setSessionStatus("Break started.");
}

async function endBreak() {
  if (!currentSessionId || !currentSessionData) return;

  const breaks = currentSessionData.breaks || [];
  const lastBreak = breaks[breaks.length - 1];

  if (!lastBreak || lastBreak.endedAt) return;

  lastBreak.endedAt = firebase.firestore.Timestamp.now();

  await db.collection("performanceSessions").doc(currentSessionId).set({
    breaks
  }, { merge: true });

  setSessionStatus("Break ended.");
}

function saveSessionNotesLive() {
  if (!currentSessionId) return;

  clearTimeout(sessionNotesSaveTimer);

  sessionNotesSaveTimer = setTimeout(async () => {
    await db.collection("performanceSessions").doc(currentSessionId).set({
      notes: document.getElementById("sessionNotesInput").value,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    setSessionStatus("Notes saved.");
  }, 600);
}

document.getElementById("sessionNotesInput")
  .addEventListener("input", saveSessionNotesLive);

    function listenToCurrentSession() {
  db.collection("karaokeControl").doc("currentSession").onSnapshot(async snap => {
    const data = snap.data();

    if (!data || !data.active || !data.sessionId) {
      currentSessionId = null;
      currentSessionData = null;
      updateSessionUi(null);
      return;
    }

    currentSessionId = data.sessionId;

    db.collection("performanceSessions").doc(currentSessionId).onSnapshot(sessionSnap => {
      currentSessionData = {
        id: sessionSnap.id,
        ...sessionSnap.data()
      };

      updateSessionUi(currentSessionData);
    });
  });
}

function updateSessionUi(session) {
  const setup = document.getElementById("sessionSetupFields");
  const labels = document.getElementById("activeSessionLabels");

  const startBtn = document.getElementById("startPerformanceBtn");
  const startBreakBtn = document.getElementById("startBreakBtn");
  const endBreakBtn = document.getElementById("endBreakBtn");
  const endBtn = document.getElementById("endPerformanceBtn");

  if (!session || session.status === "ended") {
    setup.style.display = "block";
    labels.style.display = "none";

    startBtn.disabled = false;
    startBreakBtn.disabled = true;
    endBreakBtn.disabled = true;
    endBtn.disabled = true;
    return;
  }

  setup.style.display = "none";
  labels.style.display = "block";

  document.getElementById("sessionTitleLabel").innerText = session.title || "";
  document.getElementById("venueLabel").innerText = session.venue || "";
  document.getElementById("sessionNotesInput").value = session.notes || "";

  const breaks = session.breaks || [];
  const lastBreak = breaks[breaks.length - 1];
  const inBreak = lastBreak && !lastBreak.endedAt;

  startBtn.disabled = true;
  startBreakBtn.disabled = inBreak;
  endBreakBtn.disabled = !inBreak;
  endBtn.disabled = false;

  updateBreaksLabel(session);
}

function updateBreaksLabel(session) {
  const breaksLabel = document.getElementById("breaksLabel");
  if (!breaksLabel) return;

  const breaks = session.breaks || [];
  let totalMs = 0;

  breaks.forEach(br => {
    const start = br.startedAt?.toDate ? br.startedAt.toDate() : null;
    const end = br.endedAt?.toDate ? br.endedAt.toDate() : new Date();

    if (start) totalMs += end - start;
  });

  const mins = Math.floor(totalMs / 60000);
  breaksLabel.innerText = `Breaks: ${breaks.length} ( ${mins}mins )`;
}

listenToCurrentSession();
