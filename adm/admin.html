<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Live Karaoke Admin</title>

  <link rel="stylesheet" href="../css/style.css">

</head>

<body class="admin-body">

  <div class="admin-container">

    <h1>LIVE KARAOKE ADMIN</h1>

    <button onclick="setLive(true)" class="admin-btn live-btn">
      GO LIVE
    </button>

    <button onclick="setLive(false)" class="admin-btn">
      END LIVE
    </button>

    <button onclick="toggleSongs(true)" class="admin-btn">
      ENABLE SONGS
    </button>

    <button onclick="toggleSongs(false)" class="admin-btn">
      LOCK SONGS
    </button>

  </div>


  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>


  <script>

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain: "livekaraokemt.firebaseapp.com",

      projectId: "livekaraokemt",

      storageBucket: "livekaraokemt.firebasestorage.app",

      messagingSenderId: "425980659562",

      appId: "1:425980659562:web:892ddcd53fb209d1114713"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();


    function setLive(state) {

      db.collection("karaoke").doc("state").update({

        isLive: state,

        manualOverride: true

      });

    }


    function toggleSongs(state) {

      db.collection("karaoke").doc("state").update({

        songsEnabled: state

      });

    }

  </script>

</body>

</html>
