<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics & Chords Viewer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      background: #000;
    }
  </style>
</head>

<body>

  <iframe id="pdfViewer"></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);

    const file = params.get("file");
    const page = params.get("page") || 1;

    const allowedFiles = {
      karaoke: "../files/livekaraokelyrics1_4.pdf",
      performance: "../files/liveperformancelyrics.pdf"
    };

    if (allowedFiles[file]) {
      document.getElementById("pdfViewer").src =
        allowedFiles[file] + "#page=" + page;
    } else {
      document.body.innerHTML = "<h1 style='color:white;text-align:center;margin-top:40px;'>PDF not found</h1>";
    }
  </script>

</body>
</html>
