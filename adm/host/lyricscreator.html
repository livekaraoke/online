<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lyrics Creator</title>
  <link rel="stylesheet" href="../css/lyricscreator.css">
</head>

<body>

<header class="topbar">
  <a href="admin.html" class="btn">← Admin</a>
  <h1>Lyrics & Chords Creator</h1>
  <button onclick="downloadJS()" class="btn red">Download JS File</button>
</header>

<section class="song-meta">
  <input id="songTitle" placeholder="Song title">
  <input id="artistName" placeholder="Artist">

  <input id="userBpm" placeholder="User BPM e.g. 96">
  <input id="originalBpm" placeholder="Original BPM e.g. 101">

  <input id="capoNote" placeholder="Capo note e.g. Capo 2">
  <input id="songKey" placeholder="Key e.g. Key: C#">
</section>

<section class="editor-panel">

  <h2>Create Section</h2>

  <div class="section-title-row">
    <select id="sectionTitlePreset" onchange="loadSectionPreset()">
      <option value="">SECTION TITLE</option>
      <option value="VERSE">VERSE</option>
      <option value="CHORUS">CHORUS</option>
      <option value="PRE-CHORUS">PRE-CHORUS</option>
      <option value="POST-CHORUS">POST-CHORUS</option>
      <option value="BRIDGE">BRIDGE</option>
      <option value="SOLO">SOLO</option>
      <option value="INSTRUMENTAL">INSTRUMENTAL</option>
    </select>
  
    <input id="sectionTitleCustom" placeholder="SECTION TITLE">
  </div>
  
  <div class="controls">
  
    <select id="fontFamily" onchange="updateEditorFont()">
      <option value="Arial">Arial</option>
      <option value="Verdana">Verdana</option>
      <option value="Bahnschrift">Bahnschrift</option>
      <option value="Courier New">Courier New</option>
    </select>
  
    <div class="color-picker">
      <button class="color-btn active" style="background:white" onclick="setSectionColor('white', this)"></button>
      <button class="color-btn" style="background:#7CFF3A" onclick="setSectionColor('#7CFF3A', this)"></button>
      <button class="color-btn" style="background:#FFD400" onclick="setSectionColor('#FFD400', this)"></button>
      <button class="color-btn" style="background:#FF7A1A" onclick="setSectionColor('#FF7A1A', this)"></button>
      <button class="color-btn" style="background:#ff3333" onclick="setSectionColor('#ff3333', this)"></button>
    </div>
  
    <div class="format-buttons">
      <button type="button" onclick="formatText('bold')"><b>B</b></button>
      <button type="button" onclick="formatText('italic')"><i>I</i></button>
      <button type="button" onclick="formatText('underline')"><u>U</u></button>
    </div>
  
    <div class="format-buttons">
      <button type="button" onclick="formatText('justifyLeft')">L</button>
      <button type="button" onclick="formatText('justifyCenter')">C</button>
      <button type="button" onclick="formatText('justifyRight')">R</button>
    </div>
  
    <div class="color-picker">
      <button class="color-btn" style="background:#7CFF3A" onclick="formatColor('#7CFF3A')"></button>
      <button class="color-btn" style="background:#FFD400" onclick="formatColor('#FFD400')"></button>
      <button class="color-btn" style="background:#FF7A1A" onclick="formatColor('#FF7A1A')"></button>
      <button class="color-btn" style="background:#ff3333" onclick="formatColor('#ff3333')"></button>
    </div>
  
  </div>
  
  <div id="sectionEditor" contenteditable="true" class="section-editor">
    Enter chords and lyrics here...
  </div>
  
  <button onclick="addSection()" class="btn red">Add Section</button>

</section>

<section class="preview-area">
  <div class="song-preview">

    <div class="song-header">
      <h3 id="previewTitle">Song Title - Artist</h3>
      <div class="preview-meta-right">
        <div id="previewUserBpm"></div>
        <div id="previewOriginalBpm"></div>
        <div id="previewCapo"></div>
        <div id="previewKey"></div>
      </div>
    </div>

    <div id="sectionsPreview"></div>

  </div>
</section>

<script src="../js/lyricscreator.js"></script>

</body>
</html>
