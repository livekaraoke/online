<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lyrics Viewer</title>
  <link rel="stylesheet" href="../css/lyricsviewer.css">
</head>

<body>

<header class="viewer-topbar">
  <a href="../admin.html" class="viewer-btn">◀ Back to Admin</a>
  <h1>Lyrics Viewer ●</h1>
</header>

<main class="viewer-list">
  <input id="searchLyrics" placeholder="Search lyrics...">
  <div id="lyricsList"></div>
</main>

<!--<script src="lyrics/new-lyrics-data/lyrics-index.js"></script>-->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC4gSodXM35E2ZdYaz6mrCvTUYzW75ZCBk",
    authDomain: "livekaraokemt.firebaseapp.com",
    projectId: "livekaraokemt",
    storageBucket: "livekaraokemt.firebasestorage.app",
    messagingSenderId: "425980659562",
    appId: "1:425980659562:web:892ddcd53fb209d1114713"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>
  
<script>
  const list = document.getElementById("lyricsList");
  const search = document.getElementById("searchLyrics");

  let allSongs = [];

  db.collection("lyrics")
    .orderBy("title")
    .onSnapshot(snapshot => {
      allSongs = [];

      snapshot.forEach(doc => {
        const song = doc.data();
        song.firebaseId = doc.id;
        allSongs.push(song);
      });

      renderLyrics();
    });

  function renderLyrics(filter = "") {
    list.innerHTML = "";

    allSongs
      .filter(song =>
        `${song.title} ${song.artist}`
          .toLowerCase()
          .includes(filter.toLowerCase())
      )
      .forEach(song => {
        const a = document.createElement("a");
        a.className = "lyrics-item";
        a.href = `lyricview.html?id=${encodeURIComponent(song.firebaseId)}`;

        a.innerHTML = `
          <strong>${song.title}</strong>
          <span>${song.artist}</span>
        `;

        list.appendChild(a);
      });
  }

  search.addEventListener("input", e => {
    renderLyrics(e.target.value);
  });
</script>

</body>
</html>
