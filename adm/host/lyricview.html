    authDomain: "livekaraokemt.firebaseapp.com",

    storageBucket: "livekaraokemt.firebasestorage.app",

  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  window.db = db;
  window.LK = window.LK || {};

<script>
  const params = new URLSearchParams(window.location.search);
  const songId = params.get("id");

  // ADDED: keep the latest song data available for performance logging
  let currentSongData = null;
  // END ADDED

  if (!songId) {
    document.body.innerHTML =
      "<h1 style='color:white;text-align:center;'>No song selected</h1>";
  } else {
    db.collection("lyrics").doc(songId).onSnapshot(doc => {
      if (!doc.exists) {
        document.getElementById("lyricsContent").innerHTML =
          "<p>Could not load song data.</p>";
        return;
      }

      const song = doc.data();
      currentSongData = song; // ADDED
      renderSong(song, songId);
    });
  }

  function renderSong(song, songId) {
    document.getElementById("songTitle").innerText =
      `${song.title} - ${song.artist}`;

    document.getElementById("topbarSongTitle").innerHTML = `
        <div class="topbar-song-name">${escapeHTML(song.title)}</div>
        <div class="topbar-song-artist">${escapeHTML(song.artist)}</div>
      `;

    document.getElementById("userBpm").innerText =
      song.userBpm ? `${song.userBpm} BPM` : "";

    document.getElementById("originalBpm").innerText =
      song.originalBpm ? `Original: ${song.originalBpm} BPM` : "";

    document.getElementById("capo").innerText =
      song.capo ? `Capo: ${song.capo}` : "";

    document.getElementById("songKey").innerText =
      song.key ? `Key: ${song.key}` : "";

    document.getElementById("songYear").innerText =
      song.year ? `Year: ${song.year}` : "";

    const youtubeBtn = document.getElementById("youtubeBtn");

    if (song.youtubeLink) {
      youtubeBtn.style.display = "inline-block";
      youtubeBtn.onclick = () => openYoutubePopup(song.youtubeLink);
    } else {
      youtubeBtn.style.display = "none";
    }

    // ADDED: connect performance buttons to Firestore logging
    setupPerformanceLogButtons(song, songId);
    // END ADDED

    document.getElementById("sendToSingerBtn").onclick = async () => {
    const karaokeId = song.karaokeLyrics;
  
    if (!karaokeId || karaokeId === "No") {
      showAlert("No Karaoke Lyrics connected", "This song has no Karaoke Lyrics ID.");
      return;
    }
  
    await db.collection("karaokeControl").doc("liveLyrics").set({
      currentSongId: karaokeId,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  
    showAlert("Singer screen updated.", "Singer screen updated according to the Karaoke Lyrics ID.");
  };

    document.getElementById("editBtn").onclick = () => {
      window.location.href =
        `lyricscreator.html?firebaseId=${encodeURIComponent(songId)}`;
    };

    const container = document.getElementById("lyricsContent");
    container.innerHTML = "";

    (song.sections || []).forEach(section => {
      if (section.type === "separator") {
        const sep = document.createElement("div");
        sep.className = "viewer-separator";
        container.appendChild(sep);
        return;
      }

      const div = document.createElement("section");

      const isTab = section.type === "tab";
      const isCollapsed = isTab && section.collapsed === true;

      div.className = isTab
        ? `viewer-section viewer-tab ${isCollapsed ? "collapsed-tab" : ""}`
        : "viewer-section";

      div.style.fontFamily = section.style?.fontFamily || "Verdana";
      div.style.color = section.style?.color || "white";

      let displayHtml = section.html || "";
      
      if (isTab) {
        displayHtml = section.html || "";
      }

/* Saved symbols:  ↑   ↓   ▲    ▼    ⧉   ✕   ✖  */

      div.innerHTML = `
        ${section.title
          ? `<h2>${isTab ? (isCollapsed ? "▶ " : "▼ ") : ""}${escapeHTML(section.title)}${isTab ? " (Tab)" : ""}</h2>`
          : ""
        }
            
        <div class="viewer-section-text">
          ${displayHtml}
        </div>
      `;

      if (isTab) {
        div.addEventListener("click", e => {
          if (e.target.tagName === "A" || e.target.tagName === "BUTTON") return;
        
          section.collapsed = !section.collapsed;
          renderSong(song, songId);
          setTimeout(() => {
            div.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 50);
        });
      }

      container.appendChild(div);
    });

    const endMarker = document.createElement("div");
    endMarker.className = "end-marker";

    const startSymb = document.createElement("div");
    startSymb.className = "marker-symbols";
    startSymb.textContent = "⦓";

    const endSymb = document.createElement("div");
    endSymb.className = "marker-symbols";
    endSymb.textContent = "⦔";

    endMarker.appendChild(startSymb);
    endMarker.append(" END ");
    endMarker.appendChild(endSymb);

    container.appendChild(endMarker);
  }

  function showAlert(title, message) {
    return new Promise(resolve => {
      const modal = document.getElementById("confirmModal");
      const titleEl = document.getElementById("confirmTitle");
      const messageEl = document.getElementById("confirmMessage");
      const ok = document.getElementById("confirmOk");
      const cancel = document.getElementById("confirmCancel");
  
      titleEl.innerText = title;
      messageEl.innerText = message;
  
      cancel.style.display = "none";
      modal.classList.remove("hidden");
  
      ok.onclick = () => {
        modal.classList.add("hidden");
        cancel.style.display = "";
        resolve(true);
      };
    });
  }

function getYoutubeEmbedUrl(url) {
  const text = String(url || "").trim();

  let id = "";

  const watchMatch = text.match(/[?&]v=([^&]+)/);
  const shortMatch = text.match(/youtu\.be\/([^?&]+)/);
  const embedMatch = text.match(/youtube\.com\/embed\/([^?&]+)/);

  if (watchMatch) id = watchMatch[1];
  else if (shortMatch) id = shortMatch[1];
  else if (embedMatch) id = embedMatch[1];

  if (!id) return "";

  return `https://www.youtube.com/embed/${id}?autoplay=1`;
}

function openYoutubePopup(url) {
  const embedUrl = getYoutubeEmbedUrl(url);

  if (!embedUrl) {
    showAlert("Invalid YouTube Link", "This song does not have a valid YouTube link.");
    return;
  }

  document.getElementById("youtubePlayerWrap").innerHTML = `
    <iframe
      src="${embedUrl}"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  `;

  document.getElementById("youtubeModal").classList.remove("hidden");
}

function closeYoutubePopup() {
  document.getElementById("youtubePlayerWrap").innerHTML = "";
  document.getElementById("youtubeModal").classList.add("hidden");
}

  function toggleBackMenu() {
    document.getElementById("backDropdown").classList.toggle("show");
  }

  function escapeHTML(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  /************************************************************
   * ADDED: FLOATING HALF-PAGE SCROLL
   ************************************************************/
  function slowHalfPageScroll(direction) {
    const distance = Math.round(window.innerHeight * 0.5) * direction;
    const startY = window.scrollY;
    const maxY = document.documentElement.scrollHeight - window.innerHeight;
    const targetY = Math.max(0, Math.min(maxY, startY + distance));
    const duration = 900;
    const startTime = performance.now();

    function easeInOut(t) {
      return t < 0.5
        ? 2 * t * t
        : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function step(now) {
      const progress = Math.min((now - startTime) / duration, 1);
      const eased = easeInOut(progress);
      window.scrollTo(0, startY + (targetY - startY) * eased);

      if (progress < 1) {
        requestAnimationFrame(step);
      }
    }

    requestAnimationFrame(step);
  }

  /************************************************************
   * ADDED: PERFORMANCE LOGGING TO CURRENT SESSION
   ************************************************************/
  function setupPerformanceLogButtons(song, songId) {
    const wrap = document.getElementById("performanceLogButtons");
    const meBtn = document.getElementById("performedByMeBtn");
    const singerBtn = document.getElementById("performedBySingerBtn");

    if (!wrap || !meBtn || !singerBtn) return;

    wrap.style.display = "flex";

    meBtn.onclick = () => logSongPerformance("self", song, songId);
    singerBtn.onclick = () => logSongPerformance("singer", song, songId);
  }

  async function getCurrentSessionIdOrTest() {
    try {
      const currentSnap = await db.collection("karaokeControl").doc("currentSession").get();
      const current = currentSnap.exists ? currentSnap.data() : null;

      if (current && current.active === true && current.sessionId) {
        return current.sessionId;
      }

      const testRef = db.collection("performanceSessions").doc("test-session");
      const testSnap = await testRef.get();

      if (!testSnap.exists) {
        await testRef.set({
          title: "Test Session",
          venue: "Test",
          status: "test",
          isActive: false,
          breakOpen: false,
          notes: "Automatically created because a song was logged without an active session.",
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      }

      return "test-session";
    } catch (error) {
      console.error("Could not get current session:", error);
      return "test-session";
    }
  }

  async function logSongPerformance(performedBy, song, songId) {
    const label = performedBy === "self" ? "Performed by Me" : "Performed by Singer";

    try {
      setPerformanceButtonsDisabled(true);

      const sessionId = await getCurrentSessionIdOrTest();

      await db.collection("performanceLogs").add({
        sessionId,
        songId,
        songTitle: song.title || "",
        songArtist: song.artist || "",
        userBpm: song.userBpm || "",
        originalBpm: song.originalBpm || "",
        capo: song.capo || "",
        key: song.key || "",
        year: song.year || "",
        performedBy, // "self" or "singer"
        performanceType: label,
        source: "lyricview.html",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      await db.collection("performanceSessions").doc(sessionId).collection("performedSongs").add({
        songId,
        songTitle: song.title || "",
        songArtist: song.artist || "",
        performedBy,
        performanceType: label,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      await showAlert("Performance Logged", `${label} has been logged.`);
      window.location.href = "lyricsviewer.html";
    } catch (error) {
      console.error(error);
      setPerformanceButtonsDisabled(false);
      showAlert("Log Failed", "Could not log this performance. Check Firebase permissions for performanceLogs and performanceSessions.");
    }
  }

  function setPerformanceButtonsDisabled(disabled) {
    const meBtn = document.getElementById("performedByMeBtn");
    const singerBtn = document.getElementById("performedBySingerBtn");

    if (meBtn) meBtn.disabled = disabled;
    if (singerBtn) singerBtn.disabled = disabled;
  }
  /************************************************************
   * END ADDED
   ************************************************************/
  
</script>
