<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lyric View</title>
  <link rel="stylesheet" href="../css/lyricsviewer.css">
</head>

<body>

<header class="viewer-topbar">
  <!-- BACK BUTTON -->
  <div class="back-split">
    <button onclick="history.back()" class="viewer-btn">◀ BACK</button>
    <button onclick="toggleBackMenu()" class="viewer-btn back-arrow">▼</button>
  
    <div id="backDropdown" class="back-dropdown">
      <button onclick="history.back()">Back to previous page</button>
      <button onclick="window.location.href='../admin.html'">Admin Main Page</button>
      <button onclick="window.location.href='lyricsviewer.html'">Song List</button>
    </div>
  </div>

  <!-- TOP BAR TITLE -->
  <div id="topbarSongTitle" class="topbar-song-title">
    Loading...
  </div>

  <button id="sendToSingerBtn" class="viewer-btn red send-to-singer-screen">
    🎤 Send to Singer Screen
  </button>
  
  <button id="editBtn" class="viewer-btn red">📝 EDIT</button>
</header>

<!-- LYRIC PAGE -->
<main class="lyric-page">

  <div class="song-header">

    <div class="song-title-area">
      <h1 id="songTitle"></h1>
      <div id="songYear"></div>
      <div id="karaokeLyrics"></div>
      <div id="songNote"></div>
    </div>

    <div class="song-meta-box">
      <div id="userBpm"></div>
      <div id="originalBpm"></div>
      <div id="capo"></div>
      <div id="songKey"></div>
    </div>

  </div>

  <div id="lyricsContent"></div>

</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC4gSodXM35E2ZdYaz6mrCvTUYzW75ZCBk",
    authDomain: "livekaraokemt.firebaseapp.com",
    projectId: "livekaraokemt",
    storageBucket: "livekaraokemt.firebasestorage.app",
    messagingSenderId: "425980659562",
    appId: "1:425980659562:web:892ddcd53fb209d1114713"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>

  
<script>
  const params = new URLSearchParams(window.location.search);
  const songId = params.get("id");

  if (!songId) {
    document.body.innerHTML =
      "<h1 style='color:white;text-align:center;'>No song selected</h1>";
  } else {
    db.collection("lyrics").doc(songId).onSnapshot(doc => {
      if (!doc.exists) {
        document.getElementById("lyricsContent").innerHTML =
          "<p>Could not load song data.</p>";
        return;
      }

      const song = doc.data();
      renderSong(song, songId);
    });
  }

  function renderSong(song, songId) {
    document.getElementById("songTitle").innerText =
      `${song.title} - ${song.artist}`;

    document.getElementById("topbarSongTitle").innerHTML = `
        <div class="topbar-song-name">${song.title}</div>
        <div class="topbar-song-artist">${song.artist}</div>
      `;

    document.getElementById("userBpm").innerText =
      song.userBpm ? `${song.userBpm} BPM` : "";

    document.getElementById("originalBpm").innerText =
      song.originalBpm ? `Original: ${song.originalBpm} BPM` : "";

    document.getElementById("capo").innerText =
      song.capo ? `Capo: ${song.capo}` : "";

    document.getElementById("songKey").innerText =
      song.key ? `Key: ${song.key}` : "";

    document.getElementById("songYear").innerText =
      song.year ? `Year: ${song.year}` : "";


    document.getElementById("sendToSingerBtn").onclick = async () => {
    const karaokeId = song.karaokeLyrics;
  
    if (!karaokeId || karaokeId === "No") {
      showAlert("No Karaoke Lyrics connected", "This song has no Karaoke Lyrics ID.");
      return;
    }
  
    await db.collection("karaokeControl").doc("liveLyrics").set({
      currentSongId: karaokeId,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  
    showAlert("Singer screen updated.", "Singer screen updated according to the Karaoke Lyrics ID.");
  };

    document.getElementById("editBtn").onclick = () => {
      window.location.href =
        `lyricscreator.html?firebaseId=${encodeURIComponent(songId)}`;
    };

    const container = document.getElementById("lyricsContent");
    container.innerHTML = "";

    song.sections.forEach(section => {
      if (section.type === "separator") {
        const sep = document.createElement("div");
        sep.className = "viewer-separator";
        container.appendChild(sep);
        return;
      }

      const div = document.createElement("section");

      const isTab = section.type === "tab";
      const isCollapsed = isTab && section.collapsed === true;

      div.className = isTab
        ? `viewer-section viewer-tab ${isCollapsed ? "collapsed-tab" : ""}`
        : "viewer-section";

      div.style.fontFamily = section.style?.fontFamily || "Verdana";
      div.style.color = section.style?.color || "white";

      let displayHtml = section.html || "";
      
      if (isTab) {
        displayHtml = section.html || "";
      }

      div.innerHTML = `
        ${section.title
          ? `<h2>${isTab ? (isCollapsed ? "▶ " : "⯆ ") : ""}${section.title}${isTab ? " (Tab)" : ""}</h2>`
          : ""
        }
            
        <div class="viewer-section-text">
          ${displayHtml}
        </div>
      `;

      if (isTab) {
        div.addEventListener("click", e => {
          if (e.target.tagName === "A" || e.target.tagName === "BUTTON") return;
        
          section.collapsed = !section.collapsed;
          renderSong(song, songId);
        
          setTimeout(() => {
            div.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 50);
        });
      }

      container.appendChild(div);
    });

    const endMarker = document.createElement("div");
    endMarker.className = "end-marker";
    endMarker.innerHTML = "[ END ]";
    container.appendChild(endMarker);
  }

  function showAlert(title, message) {
    return new Promise(resolve => {
      const modal = document.getElementById("confirmModal");
      const titleEl = document.getElementById("confirmTitle");
      const messageEl = document.getElementById("confirmMessage");
      const ok = document.getElementById("confirmOk");
      const cancel = document.getElementById("confirmCancel");
  
      titleEl.innerText = title;
      messageEl.innerText = message;
  
      cancel.style.display = "none";
      modal.classList.remove("hidden");
  
      ok.onclick = () => {
        modal.classList.add("hidden");
        cancel.style.display = "";
        resolve(true);
      };
    });
  }

  function toggleBackMenu() {
    document.getElementById("backDropdown").classList.toggle("show");
  }

  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
  
</script>
  <!---------------------------------------------------------------------------------------->
  <!------------------------------------ CONFIRM MODAL ------------------------------------->
  <!---------------------------------------------------------------------------------------->
  <div id="confirmModal" class="confirm-modal hidden">
    <div class="confirm-box">
      <h3 id="confirmTitle">Confirm</h3>
      <p id="confirmMessage"></p>
  
      <div class="confirm-actions">
        <button id="confirmOk" class="btn red">Confirm</button>
        <button id="confirmCancel" class="btn">Cancel</button>
      </div>
    </div>
  </div>
  <!---------------------------------------------------------------------------------------->
  <!--------------------------------- END OF CONFIRM MODAL --------------------------------->
  <!---------------------------------------------------------------------------------------->


  <!---------------------------------------------------------------------------------------->
  <!---------------------------------- TEMP SEND LYRICS ------------------------------------>
  <!---------------------------------------------------------------------------------------->


  
  <!---------------------------------------------------------------------------------------->
  <!------------------------------- END OF TEMP SEND LYRICS -------------------------------->
  <!---------------------------------------------------------------------------------------->
  
</body>
</html>
