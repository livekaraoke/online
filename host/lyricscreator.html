<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyrics & Chords Editor</title>
  <link rel="stylesheet" href="../css/lyrics-suite.css">
</head>
<body class="creator-page-v3">
  <header class="creator-v3-topbar">
    <button id="creatorBackBtn" class="creator-nav-btn" type="button">‹ LYRICS VIEWER</button>
    <div class="creator-v3-title">
      <strong>✎ EDIT LYRICS & CHORDS</strong>
      <span id="creatorEditingLabel">Editing: New Song</span>
    </div>
    <div class="creator-save-split">
      <button id="creatorSaveBtn" type="button">SAVE SONG</button>
      <button id="creatorSaveMenuBtn" type="button">▼</button>
      <div id="creatorSaveMenu" class="creator-save-menu hidden">
        <button id="creatorCancelChangesBtn" type="button">CANCEL CHANGES</button>
      </div>
    </div>
  </header>

  <main class="creator-v3-shell">
    <section class="creator-v3-panel song-details-panel">
      <div class="creator-panel-head"><h2>SONG DETAILS</h2><button id="toggleSongDetailsBtn" type="button">▾</button></div>
      <div id="songDetailsBody" class="creator-meta-grid-v3">
        <label>Title *<input id="songTitle" placeholder="Song title"></label>
        <label>Artist *<input id="artistName" placeholder="Artist"></label>
        <label>User BPM<input id="userBpm" inputmode="numeric" placeholder="104"></label>
        <label>Original BPM<input id="originalBpm" inputmode="numeric" placeholder="104"></label>
        <label>Key<input id="songKey" placeholder="G"></label>
        <label>Capo<input id="capoNote" inputmode="numeric" placeholder="0"></label>
        <label>Year<input id="songYear" inputmode="numeric" placeholder="2026"></label>
        <label>Time Signature<input id="timeSignature" placeholder="4/4"></label>
        <label class="wide">YouTube Link<input id="youtubeLink" placeholder="https://youtube.com/..."></label>
        <label class="wide">Song Notes<textarea id="songNote" rows="3" placeholder="General song notes…"></textarea></label>
        <label>Karaoke Lyrics<select id="karaokeLyrics"><option value="No">No</option></select></label>
        <label class="check-row"><input id="publicSongListVisible" type="checkbox"> Show in Public Song List</label>
      </div>
    </section>

    <section class="creator-v3-panel sections-panel-v3">
      <div class="creator-panel-head sections-head-v3">
        <div><h2>SECTIONS</h2><p>Add, reorder and edit the song exactly as it will appear live.</p></div>
      </div>

      <div class="creator-add-bar">
        <button data-add-type="lyrics">＋ LYRICS / CHORDS</button>
        <button data-add-type="tab">＋ TAB</button>
        <button data-add-type="performance-note" class="green">＋ PERFORMANCE NOTE</button>
        <button data-add-type="host-note" class="blue">＋ HOST NOTE</button>
        <button data-add-type="separator">＋ SEPARATOR</button>
        <div class="template-split">
          <button id="templateBtn" type="button">＋ SECTION TEMPLATE</button>
          <div id="templateMenu" class="template-menu hidden"></div>
        </div>
      </div>

      <div id="creatorSections" class="creator-sections-v3"></div>
    </section>
  </main>

  <div id="chordModal" class="suite-modal hidden">
    <div class="suite-modal-box chord-dialog">
      <h3>Insert Chord</h3>
      <label>Chord<input id="chordInput" placeholder="e.g. C#m7/G#"></label>
      <div id="chordPreview" class="chord-preview">C</div>
      <div class="suite-modal-actions"><button id="insertChordConfirm" class="success" type="button">INSERT</button><button id="insertChordCancel" type="button">CANCEL</button></div>
    </div>
  </div>

  <div id="creatorConfirmModal" class="suite-modal hidden">
    <div class="suite-modal-box">
      <h3 id="creatorConfirmTitle">Unsaved changes</h3>
      <p id="creatorConfirmMessage">Are you sure?</p>
      <div class="suite-modal-actions"><button id="creatorConfirmYes" class="danger" type="button">YES</button><button id="creatorConfirmNo" type="button">NO</button></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  </script>
  <script src="../js/lyricscreator.js"></script>
</body>
</html>
