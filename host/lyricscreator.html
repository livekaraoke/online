<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyrics & Chords Creator</title><link rel="stylesheet" href="css/lyrics-suite.css"></head>
<body class="creator-page">
<header class="app-topbar"><a class="btn ghost" href="lyricsviewer.html">‹ LYRICS VIEWER</a><div class="brand-block"><strong id="creatorHeading">✎ LYRICS &amp; CHORDS CREATOR</strong><span id="creatorStatus">New songs are hidden from the Public Song List by default</span></div><button id="saveSongBtn" class="btn red">SAVE SONG</button></header>
<main class="creator-shell">
<section class="panel creator-meta"><h3>SONG DETAILS</h3><div class="creator-meta-grid"><label>Title *<input id="songTitleInput"></label><label>Artist *<input id="artistInput"></label><label>User BPM<input id="userBpmInput" type="number"></label><label>Original BPM<input id="originalBpmInput" type="number"></label><label>Key<input id="keyInput" placeholder="G, Am, F#..."></label><label>Capo<input id="capoInput"></label><label>Year<input id="yearInput" type="number"></label><label>Time Signature<input id="timeSignatureInput" value="4/4"></label><label class="wide">YouTube Link<input id="youtubeInput"></label><label class="wide">Host Notes<textarea id="hostNoteInput"></textarea></label></div><label class="public-default-note"><input id="publicVisibleInput" type="checkbox"> Show this song in the Public Song List</label></section>
<section class="panel creator-section-tools"><div class="panel-title-row"><h3>SECTIONS</h3><div><button id="addLyricsSectionBtn" class="btn ghost">＋ LYRICS / CHORDS</button><button id="addTabSectionBtn" class="btn ghost">＋ TAB</button><button id="addPerformanceNoteBtn" class="btn green">＋ PERFORMANCE NOTE</button><button id="addSeparatorBtn" class="btn ghost">＋ SEPARATOR</button></div></div><div id="sectionEditorList" class="creator-sections"></div></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/lyrics-common.js"></script><script src="js/lyricscreator.js"></script></body></html>
