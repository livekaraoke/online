<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setlist Editor</title>
  <link rel="stylesheet" href="css/lyrics-suite.css">
  <style>
    .setlist-auth-gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0,0,0,.94);
    }
    .setlist-auth-box {
      width: min(420px, 100%);
      padding: 26px;
      border: 1px solid #a51b20;
      border-radius: 12px;
      background: linear-gradient(145deg,#151515,#090909);
      box-shadow: 0 0 30px rgba(180,0,0,.22);
    }
    .setlist-auth-box h2 { margin: 0 0 8px; }
    .setlist-auth-box p { color: #999; line-height: 1.45; }
    .setlist-auth-box input {
      width: 100%;
      margin: 7px 0;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 7px;
      background: #070707;
      color: #fff;
    }
    .setlist-auth-actions { display: flex; gap: 9px; margin-top: 12px; }
    .setlist-auth-actions button { flex: 1; }
    .setlist-auth-error { min-height: 20px; color: #ff6268; margin-top: 10px; }
    .setlist-auth-state {
      color: #71e879;
      font-size: 12px;
      font-weight: 800;
      margin-left: auto;
    }
    .setlist-editor-message {
      min-height: 20px;
      margin: 8px 0 0;
      color: #f4c544;
      font-size: 13px;
    }
  </style>
</head>
<body class="setlist-page">

  <div id="setlistLoadingGate" class="setlist-auth-gate">
    <div class="setlist-auth-box">
      <h2>Loading Setlist Editor</h2>
      <p id="setlistLoadingMessage">Checking your existing Admin login...</p>
      <div id="setlistAuthError" class="setlist-auth-error"></div>
      <div id="setlistLoginFallback" class="setlist-auth-actions hidden">
        <a class="btn red" href="admin.html">GO TO ADMIN LOGIN</a>
        <button id="retryAuthBtn" class="btn ghost" type="button">RETRY</button>
      </div>
    </div>
  </div>

  <header class="app-topbar">
    <a class="btn ghost" href="lyricsviewer.html">‹ LYRICS VIEWER</a>
    <div class="brand-block">
      <strong>☷ SETLIST EDITOR</strong>
      <span>Create, order and manage performance setlists</span>
    </div>
    <span id="setlistAuthState" class="setlist-auth-state"></span>
    <button id="newSetlistBtn" class="btn red" type="button" disabled>＋ NEW SETLIST</button>
  </header>

  <main class="setlist-shell">
    <aside class="setlist-list-panel panel">
      <div class="panel-title-row">
        <h3>SETLISTS</h3>
        <span id="setlistCount">0</span>
      </div>
      <div id="setlistList" class="setlist-list"></div>
    </aside>

    <section class="setlist-editor-panel panel">
      <div id="setlistEmpty" class="empty-state">Select a setlist or create a new one.</div>

      <div id="setlistEditor" class="hidden">
        <div class="setlist-header-fields">
          <input id="setlistNameInput" placeholder="Setlist name">
          <textarea id="setlistNotesInput" placeholder="Setlist notes"></textarea>
          <div>
            <button id="saveSetlistBtn" class="btn red" type="button">SAVE SETLIST</button>
            <button id="deleteSetlistBtn" class="btn ghost" type="button">DELETE</button>
          </div>
        </div>

        <div id="setlistEditorMessage" class="setlist-editor-message"></div>

        <div class="setlist-columns">
          <section>
            <div class="panel-title-row">
              <h3>SONGS IN SETLIST</h3>
              <span id="selectedSongCount">0</span>
            </div>
            <div id="selectedSongs" class="setlist-song-list"></div>
          </section>

          <section>
            <div class="panel-title-row">
              <h3>AVAILABLE SONGS</h3>
              <input id="availableSearch" placeholder="Search songs...">
            </div>
            <div id="availableSongs" class="setlist-song-list"></div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/setlist-editor.js"></script>
</body>
</html>
